            <div class="font-bold leading-tight" x-text="profile?.name"></div>
            <div class="text-slate-500 dark:text-slate-400 leading-tight capitalize" x-text="profile?.role"></div>
          </div>
        </div>
        <div class="cursor-pointer toggle-switch" :class="theme==='dark' ? 'on' : ''" @click="toggleTheme()" title="Theme"></div>
        <button @click="mode==='demo' ? switchMode('cloud') : switchMode('demo')" class="btn btn-ghost btn-sm" :title="mode==='demo' ? 'Ganti ke Cloud' : 'Ganti ke Demo'">
          <i :data-lucide="mode==='demo' ? 'cloud' : 'gamepad-2'" class="w-4 h-4"></i>
        </button>
        <button @click="openConfig()" class="btn btn-ghost btn-sm" title="Pengaturan"><i data-lucide="settings" class="w-4 h-4"></i></button>
        <button @click="logout()" class="btn btn-ghost btn-sm text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50" title="Logout">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- GURU DASHBOARD -->
    <main x-show="isGuru" x-init="loadGuruData()" class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
      <div class="flex flex-wrap gap-2 mb-6">
        <button @click="tab='classes'" class="tab-btn" :class="tab==='classes'?'tab-active':'tab-inactive'"><i data-lucide="school" class="w-4 h-4"></i> Kelas</button>
        <button @click="tab='materials'" class="tab-btn" :class="tab==='materials'?'tab-active':'tab-inactive'"><i data-lucide="book-open" class="w-4 h-4"></i> Materi & Soal</button>
        <button @click="tab='live'" class="tab-btn" :class="tab==='live'?'tab-active':'tab-inactive'"><i data-lucide="activity" class="w-4 h-4"></i> Live Monitor</button>
        <button @click="tab='reports'" class="tab-btn" :class="tab==='reports'?'tab-active':'tab-inactive'"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Laporan</button>
      </div>

      <!-- CLASSES -->
      <section x-show="tab==='classes'" class="space-y-6">
        <div class="card p-5">
          <h3 class="font-bold mb-3 flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i> Buat Kelas Baru</h3>
          <div class="flex gap-2 flex-col sm:flex-row">
            <input x-model="newClass.title" @keydown.enter="createClass()" class="input flex-1" placeholder="Contoh: Matematika Kelas X IPA 1">
            <button @click="createClass()" class="btn btn-primary"><i data-lucide="plus" class="w-4 h-4"></i> Buat Kelas</button>
          </div>
        </div>
        <div>
          <h3 class="font-bold mb-3">Daftar Kelas (<span x-text="classes.length"></span>)</h3>
          <div class="grid md:grid-cols-2 gap-4">
            <template x-for="c in classes" :key="c.id">
              <div class="card p-4">
                <div class="flex items-start justify-between gap-3 mb-3">
                  <div class="flex-1 min-w-0">
                    <div class="font-bold truncate" x-text="c.title"></div>
                    <div class="text-xs text-slate-500 mt-0.5">Dibuat <span x-text="fmtDate(c.created_at)"></span></div>
                  </div>
                  <button @click="deleteClass(c.id)" class="text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 p-1.5 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
                <div class="flex items-center gap-2 bg-gradient-to-r from-sky-50 to-sky-100 dark:from-sky-950/60 dark:to-sky-900/40 border border-sky-200 dark:border-sky-800 rounded-xl px-3 py-2.5 mb-3">
                  <i data-lucide="key-round" class="w-4 h-4 text-sky-700 dark:text-sky-300"></i>
                  <span class="font-mono font-bold text-sky-800 dark:text-sky-200 tracking-widest flex-1" x-text="c.class_code"></span>
                  <button @click="copyCode(c.class_code)" class="text-sky-700 dark:text-sky-300 hover:text-sky-900" title="Copy"><i data-lucide="copy" class="w-4 h-4"></i></button>
                </div>
                <div class="text-xs font-semibold mb-2 flex items-center gap-1"><i data-lucide="users" class="w-3 h-3"></i> Siswa: <span x-text="membersOf(c.id).length"></span></div>
                <div class="flex flex-wrap gap-1.5 max-h-24 overflow-auto">
                  <template x-for="m in membersOf(c.id)" :key="m.id">
                    <span class="chip bg-slate-100 dark:bg-slate-800" x-text="m.profiles?.name || '—'"></span>
                  </template>
                  <template x-if="membersOf(c.id).length===0"><span class="text-xs text-slate-400 italic">Belum ada siswa</span></template>
                </div>
              </div>
            </template>
            <template x-if="classes.length===0"><div class="col-span-full card p-10 text-center text-slate-500"><i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>Belum ada kelas.</div></template>
          </div>
        </div>
        <template x-if="mode==='cloud'">
          <div class="rounded-2xl border border-orange-200 dark:border-orange-800/60 bg-gradient-to-br from-orange-50 to-white dark:from-orange-950/40 dark:to-slate-900/40 p-4">
            <div class="flex items-start gap-3">
              <div class="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center flex-shrink-0"><i data-lucide="package-plus" class="w-5 h-5"></i></div>
              <div class="flex-1">
                <div class="font-bold text-orange-800 dark:text-orange-300">Import Data Demo ke Cloud</div>
                <p class="text-xs text-slate-600 dark:text-slate-400 mt-1 mb-2">Pindahkan kelas, materi, dan soal dari Demo Mode ke akun cloud.</p>
                <button @click="migrateDemoToCloud()" class="btn btn-orange btn-sm"><i data-lucide="upload-cloud" class="w-3 h-3"></i> Migrate Sekarang</button>
              </div>
            </div>
          </div>
        </template>
      </section>

      <!-- MATERIALS -->
      <section x-show="tab==='materials'" class="space-y-6">
        <div class="grid lg:grid-cols-5 gap-5">
          <div class="lg:col-span-2">
            <div class="card p-5 space-y-3">
              <h3 class="font-bold flex items-center gap-2"><i data-lucide="file-plus-2" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i> Materi Baru</h3>
              <div>
                <label class="label">Kelas</label>
                <select x-model="newMaterial.class_id" class="input">
                  <option value="">-- Pilih kelas --</option>
                  <template x-for="c in classes" :key="c.id"><option :value="c.id" x-text="c.title"></option></template>
                </select>
              </div>
              <div><label class="label">Judul</label><input x-model="newMaterial.title" class="input" placeholder="Persamaan Kuadrat"></div>
              <div><label class="label">Konten (Markdown)</label><textarea x-model="newMaterial.content" rows="8" class="input font-mono text-xs" placeholder="# Judul&#10;&#10;Materi..."></textarea></div>
              <div class="rounded-xl border border-orange-200 dark:border-orange-800/60 bg-gradient-to-br from-orange-50 to-white dark:from-orange-950/40 dark:to-slate-900/40 p-3">
                <label class="label text-orange-700 dark:text-orange-400">✨ Generate Materi dengan AI</label>
                <div class="flex gap-2">
                  <input x-model="aiMaterial.topic" class="input flex-1 text-sm" placeholder="Topik materi">
                  <button @click="aiGenerateMaterial()" :disabled="aiMaterial.loading" class="btn btn-orange btn-sm">
                    <template x-if="aiMaterial.loading"><i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i></template>
                    <template x-if="!aiMaterial.loading"><i data-lucide="sparkles" class="w-3 h-3"></i></template>
                    Generate
                  </button>
                </div>
              </div>
              <button @click="createMaterial()" class="btn btn-primary w-full"><i data-lucide="save" class="w-4 h-4"></i> Simpan Materi</button>
            </div>
          </div>
          <div class="lg:col-span-3">
            <div class="card p-5">
              <h3 class="font-bold mb-3 flex items-center gap-2"><i data-lucide="library" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i> Materi (<span x-text="materials.length"></span>)</h3>
              <div class="space-y-2 max-h-[60vh] overflow-auto pr-1">
                <template x-for="m in materials" :key="m.id">
                  <div @click="selectMaterial(m.id)" class="p-3 rounded-xl border-2 cursor-pointer transition"
                       :class="selectedMaterialId===m.id ? 'border-sky-500 bg-sky-50 dark:bg-sky-950/40' : 'border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700'">
                    <div class="flex items-start justify-between gap-2">
                      <div class="flex-1 min-w-0">
                        <div class="font-semibold truncate" x-text="m.title"></div>
                        <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-2 flex-wrap">
                          <span class="chip bg-slate-100 dark:bg-slate-800" x-text="classTitleById(m.class_id)"></span>
                          <span x-text="fmtDate(m.created_at)"></span>
                        </div>
                      </div>
                      <div class="flex items-center gap-1">
                        <button @click.stop="toggleMaterialActive(m)" class="chip transition"
                                :class="m.is_active ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'">
                          <i :data-lucide="m.is_active ? 'eye' : 'eye-off'" class="w-3 h-3"></i>
                          <span x-text="m.is_active ? 'Aktif' : 'Draft'"></span>
                        </button>
                        <button @click.stop="deleteMaterial(m.id)" class="text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 p-1.5 rounded-lg"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                  </div>
                </template>
                <template x-if="materials.length===0"><div class="text-center text-slate-400 py-10 text-sm italic">Belum ada materi.</div></template>
              </div>
            </div>
          </div>
        </div>

        <!-- QUIZ EDITOR -->
        <div x-show="selectedMaterialId" class="card p-5">
          <h3 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="help-circle" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i> Soal Kuis (<span x-text="quizzes.length"></span>)</h3>
          <div class="grid lg:grid-cols-2 gap-5">
            <!-- Quiz list -->
            <div class="space-y-2 max-h-96 overflow-auto pr-1">
              <template x-for="(q,i) in quizzes" :key="q.id">
                <div class="p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                  <div class="flex justify-between gap-2">
                    <div class="flex-1 min-w-0">
                      <div class="text-xs font-bold text-slate-500 mb-1">Soal #<span x-text="i+1"></span></div>
                      <div class="text-sm font-semibold" x-text="q.question"></div>
                      <template x-if="q.question_image">
                        <img :src="q.question_image" class="max-h-24 rounded mt-2 border border-slate-200 dark:border-slate-700" alt="" @error="$el.style.display='none'">
                      </template>
                      <div class="mt-2 space-y-1">
                        <template x-for="(opt, idx) in q.options" :key="idx">
                          <div class="text-xs flex items-center gap-2" :class="idx===q.correct_option ? 'text-emerald-700 dark:text-emerald-400 font-bold' : 'text-slate-600 dark:text-slate-400'">
                            <span class="w-4 h-4 rounded-full border flex items-center justify-center text-[9px]" :class="idx===q.correct_option ? 'bg-emerald-100 border-emerald-300' : 'border-slate-300'"><span x-text="String.fromCharCode(65+idx)"></span></span>
                            <template x-if="q.option_images && q.option_images[idx]">
                              <img :src="q.option_images[idx]" class="h-6 rounded border border-slate-200 dark:border-slate-700" alt="" @error="$el.style.display='none'">
                            </template>
                            <span x-text="opt"></span>
                          </div>
                        </template>
                      </div>
                      <div class="text-[11px] text-slate-500 italic mt-1.5" x-text="'Penjelasan: '+q.explanation"></div>
                    </div>
                    <button @click="deleteQuiz(q.id)" class="text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 p-1.5 rounded-lg self-start"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
              </template>
              <template x-if="quizzes.length===0"><div class="text-center text-slate-400 py-8 text-sm italic">Belum ada soal.</div></template>
            </div>

            <!-- Add quiz form -->
            <div class="space-y-4">
              <div class="rounded-xl border border-orange-200 dark:border-orange-800/60 bg-gradient-to-br from-orange-50 to-white dark:from-orange-950/40 dark:to-slate-900/40 p-3">
                <label class="label text-orange-700 dark:text-orange-400">✨ Generate Soal dengan AI</label>
                <div class="grid grid-cols-3 gap-2 mb-2">
                  <input x-model="aiQuiz.topic" class="input col-span-2 text-sm" placeholder="Topik soal">
                  <input x-model.number="aiQuiz.count" type="number" min="1" max="10" class="input text-sm">
                </div>
                <button @click="aiGenerateQuiz()" :disabled="aiQuiz.loading" class="btn btn-orange btn-sm w-full">
                  <template x-if="aiQuiz.loading"><i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i></template>
                  <template x-if="!aiQuiz.loading"><i data-lucide="sparkles" class="w-3 h-3"></i></template>
                  Generate <span x-text="aiQuiz.count"></span> Soal
                </button>
              </div>

              <div class="border-t border-slate-200 dark:border-slate-800 pt-4 space-y-3">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                  <div class="text-xs font-bold text-slate-500 uppercase">Tambah Manual</div>
                  <div class="flex gap-1.5">
                    <button @click="downloadExcelTemplate()" class="btn btn-ghost btn-sm" title="Download template Excel">
                      <i data-lucide="file-spreadsheet" class="w-3 h-3"></i> Template
                    </button>
                    <label class="btn btn-orange btn-sm cursor-pointer" title="Import dari Excel">
                      <i data-lucide="upload" class="w-3 h-3"></i> Import Excel
                      <input type="file" accept=".xlsx,.xls,.csv" @change="parseExcel($event)" class="hidden">
                    </label>
                  </div>
                </div>

                <!-- Pertanyaan -->
                <div>
                  <label class="label">Pertanyaan</label>
                  <textarea x-model="newQuiz.question" rows="2" class="input text-sm" placeholder="Tulis pertanyaan..."></textarea>
                  <div class="mt-2">
                    <template x-if="newQuiz.question_image">
                      <div class="relative inline-block">
                        <img :src="newQuiz.question_image" class="max-h-32 rounded-lg border border-slate-200 dark:border-slate-700" alt="Pertanyaan" @error="$el.style.display='none'">
                        <button @click="removeQuestionImage()" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg hover:bg-rose-600" title="Hapus">
                          <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                      </div>
                    </template>
                    <template x-if="!newQuiz.question_image">
                      <div class="flex items-center gap-2">
                        <label class="btn btn-ghost btn-sm cursor-pointer">
                          <i data-lucide="image-plus" class="w-3 h-3"></i> Upload Gambar
                          <input type="file" accept="image/*" @change="handleQuestionImageUpload($event)" class="hidden" :disabled="uploadingImage">
                        </label>
                        <input type="url" x-model="newQuiz.question_image" class="input text-xs flex-1" placeholder="atau paste URL gambar">
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Opsi -->
                <div class="space-y-2">
                  <label class="label">Opsi Jawaban</label>
                  <template x-for="(opt, i) in newQuiz.options" :key="i">
                    <div class="space-y-1.5">
                      <div class="flex items-center gap-2">
                        <label class="flex items-center cursor-pointer">
                          <input type="radio" :value="i" x-model.number="newQuiz.correct_option" class="sr-only">
                          <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition"
                               :class="newQuiz.correct_option===i ? 'border-emerald-500 bg-emerald-500' : 'border-slate-300'">
                            <div class="w-1.5 h-1.5 rounded-full bg-white" x-show="newQuiz.correct_option===i"></div>
                          </div>
                        </label>
                        <span class="text-xs font-bold w-4" x-text="String.fromCharCode(65+i)"></span>
                        <input x-model="newQuiz.options[i]" class="input flex-1 text-sm" :placeholder="'Opsi ' + String.fromCharCode(65+i)">
                        <label class="text-slate-500 hover:text-orange-500 p-1 cursor-pointer" :title="'Upload gambar opsi ' + String.fromCharCode(65+i)">
                          <i data-lucide="image" class="w-3.5 h-3.5"></i>
                          <input type="file" accept="image/*" @change="handleOptionImageUpload($event, i)" class="hidden" :disabled="uploadingImage">
                        </label>
                        <button @click="removeOption(i)" class="text-slate-400 hover:text-rose-500 p-1" title="Hapus opsi">
                          <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                      <template x-if="newQuiz.option_images[i]">
                        <div class="ml-8 flex items-center gap-2">
                          <img :src="newQuiz.option_images[i]" class="max-h-16 rounded border border-slate-200 dark:border-slate-700" alt="" @error="$el.style.display='none'">
                          <input type="url" x-model="newQuiz.option_images[i]" class="input text-[10px] flex-1 font-mono" placeholder="URL gambar">
                          <button @click="removeOptionImage(i)" class="text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 p-1 rounded">
                            <i data-lucide="x" class="w-3 h-3"></i>
                          </button>
                        </div>
                      </template>
                    </div>
                  </template>
                  <button @click="addOption()" class="text-xs text-sky-600 dark:text-sky-400 font-semibold flex items-center gap-1">
                    <i data-lucide="plus" class="w-3 h-3"></i> Tambah opsi
                  </button>
                </div>

                <div><label class="label">Penjelasan</label><textarea x-model="newQuiz.explanation" rows="2" class="input text-sm"></textarea></div>
                <button @click="createQuiz()" class="btn btn-primary w-full" :disabled="uploadingImage">
                  <template x-if="uploadingImage"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i></template>
                  <template x-if="!uploadingImage"><i data-lucide="plus" class="w-4 h-4"></i></template>
                  Tambah Soal
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- LIVE MONITOR -->
      <section x-show="tab==='live'" class="space-y-5">
        <div class="card p-5">
          <div class="flex items-center justify-between flex-wrap gap-3">
            <div>
              <h3 class="font-bold flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-orange-400 animate-pulse"></span> Realtime Live Monitor</h3>
              <p class="text-xs text-slate-500 mt-1" x-text="mode==='demo' ? 'Simulasi submission siswa (Demo Mode).' : 'Submission via Supabase Realtime.'"></p>
            </div>
            <div class="flex gap-2 flex-wrap">
              <template x-if="mode==='demo'">
                <button @click="toggleSimulation()" class="btn btn-ghost btn-sm">
                  <i :data-lucide="simRunning ? 'pause' : 'play'" class="w-3 h-3"></i>
                  <span x-text="simRunning ? 'Pause' : 'Play'"></span>
                </button>
              </template>
              <button @click="loadGuruData()" class="btn btn-ghost btn-sm"><i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh</button>
              <div class="chip bg-sky-100 text-sky-800 dark:bg-sky-900/60 dark:text-sky-200"><i data-lucide="hash" class="w-3 h-3"></i><span x-text="submissions.length"></span></div>
            </div>
          </div>
        </div>
        <div class="card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 dark:bg-slate-800/60 text-xs uppercase text-slate-600 dark:text-slate-400">
                <tr>
                  <th class="text-left px-4 py-3 font-bold">Siswa</th>
                  <th class="text-left px-4 py-3 font-bold">Kelas / Materi</th>
                  <th class="text-left px-4 py-3 font-bold">Soal</th>
                  <th class="text-center px-4 py-3 font-bold">Hasil</th>
                  <th class="text-right px-4 py-3 font-bold">Waktu</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="s in submissions.slice(0,100)" :key="s.id">
                  <tr class="border-t border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40">
                    <td class="px-4 py-3 font-semibold" x-text="s.profiles?.name || '—'"></td>
                    <td class="px-4 py-3">
                      <div class="text-xs text-slate-500" x-text="s.quizzes?.materials?.classes?.title || '—'"></div>
                      <div class="text-xs font-semibold" x-text="s.quizzes?.materials?.title || '—'"></div>
                    </td>
                    <td class="px-4 py-3 max-w-xs"><div class="truncate" x-text="s.quizzes?.question || '—'"></div></td>
                    <td class="px-4 py-3 text-center">
                      <span class="chip" :class="s.is_correct ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300' : 'bg-rose-100 text-rose-700 dark:bg-rose-900/60 dark:text-rose-300'">
                        <i :data-lucide="s.is_correct ? 'check' : 'x'" class="w-3 h-3"></i>
                        <span x-text="s.is_correct ? 'Benar' : 'Salah'"></span>
                      </span>
                    </td>
                    <td class="px-4 py-3 text-right text-xs text-slate-500" x-text="fmtDate(s.created_at)"></td>
                  </tr>
                </template>
                <template x-if="submissions.length===0"><tr><td colspan="5" class="text-center py-12 text-slate-400 italic">Belum ada submission.</td></tr></template>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- REPORTS -->
      <section x-show="tab==='reports'" class="space-y-5">
        <div class="card p-5">
          <h3 class="font-bold mb-1 flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i> Laporan & Export PDF</h3>
          <p class="text-xs text-slate-500">Pilih kelas untuk export laporan resmi.</p>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <template x-for="c in classes" :key="c.id">
            <div class="card p-4">
              <div class="font-bold mb-1" x-text="c.title"></div>
              <div class="text-xs text-slate-500 mb-3">Kode: <span class="font-mono font-bold" x-text="c.class_code"></span></div>
              <button @click="exportReportPDF(c.id)" class="btn btn-orange btn-sm w-full"><i data-lucide="download" class="w-3 h-3"></i> Export PDF</button>
            </div>
          </template>
          <template x-if="classes.length===0"><div class="col-span-full card p-10 text-center text-slate-400 italic">Belum ada kelas.</div></template>
        </div>
      </section>
    </main>

    <!-- SISWA DASHBOARD -->
    <main x-show="profile?.role==='siswa'" x-init="loadSiswaData()" class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
      <div class="flex flex-wrap gap-2 mb-6">
        <button @click="tab='materials'; loadSiswaData()" class="tab-btn" :class="tab==='materials'?'tab-active':'tab-inactive'"><i data-lucide="book-open" class="w-4 h-4"></i> Materi Aktif</button>
        <button @click="tab='join'; loadSiswaData()" class="tab-btn" :class="tab==='join'?'tab-active':'tab-inactive'"><i data-lucide="user-plus" class="w-4 h-4"></i> Kelas Saya</button>
      </div>

      <section x-show="tab==='materials'" class="space-y-5">
        <div class="card p-5">
          <h3 class="font-bold flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4 text-orange-500"></i> Materi Belajar Aktif (<span x-text="materials.length"></span>)</h3>
          <p class="text-xs text-slate-500 mt-1">Hanya materi yang diaktifkan guru.</p>
        </div>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
          <template x-for="m in materials" :key="m.id">
            <div @click="openMaterial(m)" class="card p-5 hover:shadow-xl hover:-translate-y-0.5 transition cursor-pointer">
              <div class="flex items-start justify-between gap-2 mb-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-900 to-sky-500 flex items-center justify-center flex-shrink-0"><i data-lucide="file-text" class="w-5 h-5 text-white"></i></div>
                <span class="chip bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300">Aktif</span>
              </div>
              <div class="font-bold mb-1 line-clamp-2" x-text="m.title"></div>
              <div class="text-xs text-slate-500 mb-1" x-text="m.classes?.title || '—'"></div>
              <div class="text-[11px] text-slate-400 flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i><span x-text="m.classes?.profiles?.name || 'Guru'"></span></div>
            </div>
          </template>
          <template x-if="materials.length===0"><div class="col-span-full card p-10 text-center text-slate-400 italic">Belum ada materi aktif.</div></template>
        </div>
      </section>

      <section x-show="tab==='join'" class="space-y-5">
        <div class="card p-5">
          <h3 class="font-bold mb-3 flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i> Gabung Kelas</h3>
          <div class="flex gap-2">
            <input x-model="joinCode" @keydown.enter="joinClass()" class="input flex-1 font-mono uppercase tracking-widest" placeholder="XXXXXX" maxlength="6">
            <button @click="joinClass()" class="btn btn-primary"><i data-lucide="log-in" class="w-4 h-4"></i> Gabung</button>
          </div>
          <p class="text-xs text-slate-500 mt-2">Coba kode demo: <b>MTK01</b>, <b>IPA02</b>, atau <b>BIG03</b></p>
        </div>
        <div>
          <h3 class="font-bold mb-3">Kelas yang Diikuti</h3>
          <div class="grid md:grid-cols-2 gap-4">
            <template x-for="c in myClasses" :key="c.id">
              <div class="card p-4 flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-orange-500 to-orange-400 flex items-center justify-center flex-shrink-0"><i data-lucide="school" class="w-5 h-5 text-white"></i></div>
                <div class="flex-1 min-w-0">
                  <div class="font-bold truncate" x-text="c.title"></div>
                  <div class="text-xs text-slate-500">Guru: <span class="font-semibold" x-text="c.profiles?.name || '—'"></span> · <span class="font-mono" x-text="c.class_code"></span></div>
                </div>
              </div>
            </template>
            <template x-if="myClasses.length===0"><div class="col-span-full card p-10 text-center text-slate-400 italic">Belum join kelas apapun.</div></template>
          </div>
        </div>
      </section>
    </main>

    <!-- MATERIAL DETAIL MODAL (SISWA) -->
    <div x-show="viewingMaterial" x-transition.opacity class="modal-bg" @click.self="closeMaterial()" @keydown.escape.window="closeMaterial()">
      <div class="w-full max-w-3xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden border border-sky-200/50 dark:border-sky-800/50">
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-gradient-to-r from-sky-50 to-orange-50 dark:from-sky-950/60 dark:to-orange-950/30 flex items-start justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="text-[11px] uppercase tracking-wider font-bold text-sky-700 dark:text-sky-300" x-text="viewingMaterial?.classes?.title || '—'"></div>
            <h2 class="font-black text-xl leading-tight mt-0.5" x-text="viewingMaterial?.title"></h2>
            <div class="text-xs text-slate-500 mt-1 flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i><span x-text="viewingMaterial?.classes?.profiles?.name || 'Guru'"></span></div>
          </div>
          <button @click="closeMaterial()" class="text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="flex-1 overflow-auto p-6 space-y-6">
          <article class="prose-render text-sm max-w-none" x-html="renderMD(viewingMaterial?.content || '')"></article>

          <div x-show="quizzes.length > 0" class="border-t border-slate-200 dark:border-slate-800 pt-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-black text-lg flex items-center gap-2"><i data-lucide="help-circle" class="w-5 h-5 text-orange-500"></i> Kuis <span class="text-sm font-normal text-slate-500">(<span x-text="quizzes.length"></span> soal)</span></h3>
              <div x-show="quizSubmitted" class="chip bg-gradient-to-r from-orange-500 to-orange-400 text-white font-bold text-base px-3 py-1">Skor: <span x-text="score"></span></div>
            </div>
            <div class="space-y-5">
              <template x-for="(q,i) in quizzes" :key="q.id">
                <div class="border border-slate-200 dark:border-slate-800 rounded-xl p-4 bg-slate-50 dark:bg-slate-800/40">
                  <div class="font-bold mb-3 flex gap-2 flex-wrap">
                    <span class="chip bg-sky-100 text-sky-800 dark:bg-sky-900/60 dark:text-sky-200 flex-shrink-0" x-text="'#'+(i+1)"></span>
                    <span x-text="q.question"></span>
                  </div>
                  <template x-if="q.question_image">
                    <img :src="q.question_image" class="max-h-64 rounded-lg border border-slate-200 dark:border-slate-700 mb-3" alt="" @error="$el.style.display='none'">
                  </template>
                  <div class="space-y-2">
                    <template x-for="(opt, oi) in q.options" :key="oi">
                      <label class="flex items-center gap-3 p-2.5 rounded-lg cursor-pointer transition border-2"
                             :class="{
                               'border-sky-500 bg-white dark:bg-slate-900': quizAnswers[q.id]===oi && !quizSubmitted,
                               'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-slate-300': quizAnswers[q.id]!==oi && !quizSubmitted,
                               'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40': quizSubmitted && oi===q.correct_option,
                               'border-rose-400 bg-rose-50 dark:bg-rose-950/40': quizSubmitted && quizAnswers[q.id]===oi && oi!==q.correct_option,
                               'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 opacity-60': quizSubmitted && quizAnswers[q.id]!==oi && oi!==q.correct_option
                             }">
                        <input type="radio" :name="'q_'+q.id" :value="oi" x-model.number="quizAnswers[q.id]" :disabled="quizSubmitted" class="sr-only">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition"
                             :class="{
                               'border-sky-500 bg-sky-500': quizAnswers[q.id]===oi && !quizSubmitted,
                               'border-slate-300': quizAnswers[q.id]!==oi && !quizSubmitted,
                               'border-emerald-500 bg-emerald-500': quizSubmitted && oi===q.correct_option,
                               'border-rose-500 bg-rose-500': quizSubmitted && quizAnswers[q.id]===oi && oi!==q.correct_option
                             }"><span class="text-[10px] font-bold text-white" x-text="String.fromCharCode(65+oi)"></span></div>
                        <template x-if="q.option_images && q.option_images[oi]">
                          <img :src="q.option_images[oi]" class="max-h-20 rounded border border-slate-200 dark:border-slate-700" alt="" @error="$el.style.display='none'">
                        </template>
                        <span class="text-sm font-medium" x-text="opt"></span>
                      </label>
                    </template>
                  </div>
                  <div x-show="quizSubmitted" class="mt-3 text-xs bg-white dark:bg-slate-900 rounded-lg p-3 border-l-4 border-sky-500">
                    <div class="font-bold mb-1">💡 Penjelasan:</div>
                    <div class="text-slate-600 dark:text-slate-400" x-text="q.explanation"></div>
                  </div>
                </div>
              </template>
            </div>
            <div class="mt-5 flex gap-2 justify-end">
              <button x-show="!quizSubmitted" @click="submitQuiz()" :disabled="submitting" class="btn btn-primary">
                <template x-if="submitting"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i></template>
                <template x-if="!submitting"><i data-lucide="send" class="w-4 h-4"></i></template>
                Kirim Jawaban
              </button>
              <button x-show="quizSubmitted" @click="closeMaterial()" class="btn btn-orange"><i data-lucide="check" class="w-4 h-4"></i> Selesai</button>
            </div>
          </div>
          <div x-show="quizzes.length===0" class="text-center py-8 text-slate-400 italic text-sm border-t border-slate-200 dark:border-slate-800 pt-6">
            Materi ini belum memiliki soal kuis.
          </div>
        </div>
      </div>
    </div>

    <!-- EXCEL IMPORT MODAL -->
    <div x-show="excelImportOpen" x-transition.opacity class="modal-bg" @click.self="closeExcelImport()" @keydown.escape.window="closeExcelImport()">
      <div class="w-full max-w-4xl max-h-[92vh] flex flex-col bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-orange-200/50 dark:border-orange-800/50">
        <div class="px-6 py-4 bg-gradient-to-r from-orange-500 to-orange-400 text-white flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center"><i data-lucide="file-spreadsheet" class="w-5 h-5"></i></div>
          <div class="flex-1 min-w-0">
            <div class="font-bold text-lg">Import Soal dari Excel</div>
            <div class="text-xs text-orange-100 truncate" x-text="excelFileName || 'Preview'"></div>
          </div>
          <button @click="closeExcelImport()" class="text-white/90 hover:bg-white/20 p-2 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="flex-1 overflow-auto p-5">
          <div class="flex flex-wrap gap-3 mb-4">
            <div class="chip bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300">
              <i data-lucide="check-circle" class="w-3 h-3"></i>
              <span x-text="excelPreview.filter(r => r._valid).length"></span> soal valid
            </div>
            <template x-if="excelPreview.filter(r => !r._valid).length">
              <div class="chip bg-rose-100 text-rose-700 dark:bg-rose-900/60 dark:text-rose-300">
                <i data-lucide="alert-circle" class="w-3 h-3"></i>
                <span x-text="excelPreview.filter(r => !r._valid).length"></span> baris invalid
              </div>
            </template>
          </div>
          <div class="space-y-3">
            <template x-for="(row, i) in excelPreview" :key="i">
              <div class="rounded-xl border p-4"
                   :class="row._valid ? 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40' : 'border-rose-300 dark:border-rose-800 bg-rose-50 dark:bg-rose-950/40 opacity-70'">
                <div class="flex items-start gap-3">
                  <span class="chip flex-shrink-0"
                        :class="row._valid ? 'bg-sky-100 text-sky-800 dark:bg-sky-900/60 dark:text-sky-200' : 'bg-rose-100 text-rose-700'"
                        x-text="'#' + (i+1)"></span>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm font-bold mb-2" x-text="row.question"></div>
                    <template x-if="row.question_image">
                      <div class="mb-2">
                        <img :src="row.question_image" class="max-h-24 rounded border border-slate-200 dark:border-slate-700" alt="" @error="$el.style.display='none'">
                        <div class="text-[10px] text-slate-500 mt-1 truncate" x-text="row.question_image"></div>
                      </div>
                    </template>
                    <div class="space-y-1">
                      <template x-for="(opt, oi) in row.options" :key="oi">
                        <div class="flex items-center gap-2 text-xs"
                             :class="oi === row.correct_option ? 'font-bold text-emerald-700 dark:text-emerald-400' : 'text-slate-600 dark:text-slate-400'">
                          <span class="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 text-[10px]"
                                :class="oi === row.correct_option ? 'bg-emerald-100 dark:bg-emerald-900/60' : 'bg-slate-200 dark:bg-slate-700'"
                                x-text="String.fromCharCode(65+oi)"></span>
                          <template x-if="row.option_images[oi]">
                            <img :src="row.option_images[oi]" class="h-8 rounded border border-slate-200 dark:border-slate-700" alt="" @error="$el.style.display='none'">
                          </template>
                          <span x-text="opt"></span>
                        </div>
                      </template>
                    </div>
                    <div class="text-[11px] italic text-slate-500 mt-2" x-text="'💡 ' + (row.explanation || '-')"></div>
                    <template x-if="!row._valid">
                      <div class="text-xs text-rose-600 dark:text-rose-400 mt-1 font-bold" x-text="'⚠ ' + row._error"></div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
        <div class="px-5 py-4 border-t border-slate-200 dark:border-slate-800 flex gap-2 justify-end bg-slate-50 dark:bg-slate-900/60">
          <button @click="closeExcelImport()" class="btn btn-ghost">Batal</button>
          <button @click="confirmExcelImport()" class="btn btn-primary" :disabled="!excelPreview.filter(r => r._valid).length">
            <i data-lucide="check" class="w-4 h-4"></i>
            Import <span x-text="excelPreview.filter(r => r._valid).length"></span> Soal
          </button>
        </div>
      </div>
    </div>

    <footer class="border-t border-slate-200/60 dark:border-slate-800/60 py-4 text-center text-xs text-slate-500">
      LiveLearn © <span x-text="new Date().getFullYear()"></span> · <span x-text="mode==='demo' ? 'Demo Mode' : 'Cloud Mode'"></span> · <span class="gradient-text font-bold">Modern Learning Platform</span>
    </footer>
  </div>
</template>

<script>
  if (typeof window !== 'undefined') {
    window.addEventListener('load', () => {
      try { if (window.lucide) lucide.createIcons(); } catch(e){}
    });
  }
</script>
</body>
</html>

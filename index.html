/* ═══════════════════════════════════════════════════════════════════════════
   SKEMA DATABASE SUPABASE — JALANKAN DI SUPABASE SQL EDITOR
   ═══════════════════════════════════════════════════════════════════════════

-- 1. Profiles
CREATE TABLE public.profiles (
  id UUID REFERENCES auth.users ON DELETE CASCADE PRIMARY KEY,
  name TEXT NOT NULL,
  role TEXT CHECK (role IN ('guru', 'siswa')) NOT NULL,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. Classes
CREATE TABLE public.classes (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  guru_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE NOT NULL,
  siswa_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE,
  class_code TEXT UNIQUE NOT NULL,
  title TEXT NOT NULL,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 3. Class Members
CREATE TABLE public.class_members (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  class_id UUID REFERENCES public.classes(id) ON DELETE CASCADE NOT NULL,
  siswa_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE NOT NULL,
  joined_at TIMESTAMPTZ DEFAULT NOW(),
  UNIQUE(class_id, siswa_id)
);

-- 4. Materials
CREATE TABLE public.materials (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  guru_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE NOT NULL,
  class_id UUID REFERENCES public.classes(id) ON DELETE CASCADE,
  title TEXT NOT NULL,
  content TEXT NOT NULL,
  is_active BOOLEAN DEFAULT false,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 5. Quizzes (dengan gambar)
CREATE TABLE public.quizzes (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  material_id UUID REFERENCES public.materials(id) ON DELETE CASCADE NOT NULL,
  guru_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE NOT NULL,
  question TEXT NOT NULL,
  question_image TEXT,
  options JSONB NOT NULL,
  option_images JSONB DEFAULT '[]'::jsonb,
  correct_option INT NOT NULL,
  explanation TEXT NOT NULL,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 6. Quiz Submissions
CREATE TABLE public.quiz_submissions (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  quiz_id UUID REFERENCES public.quizzes(id) ON DELETE CASCADE NOT NULL,
  siswa_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE NOT NULL,
  student_answer INT NOT NULL,
  is_correct BOOLEAN NOT NULL,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 7. User Settings
CREATE TABLE public.user_settings (
  user_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE PRIMARY KEY,
  theme TEXT DEFAULT 'dark',
  ai_provider TEXT,
  ai_model TEXT,
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

-- TRIGGER AUTO-PROFILE
CREATE OR REPLACE FUNCTION public.handle_new_user()
RETURNS TRIGGER AS $$
BEGIN
  INSERT INTO public.profiles (id, name, role)
  VALUES (NEW.id,
          COALESCE(NEW.raw_user_meta_data->>'name','User'),
          COALESCE(NEW.raw_user_meta_data->>'role','siswa'))
  ON CONFLICT (id) DO NOTHING;
  RETURN NEW;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

DROP TRIGGER IF EXISTS on_auth_user_created ON auth.users;
CREATE TRIGGER on_auth_user_created
  AFTER INSERT ON auth.users
  FOR EACH ROW EXECUTE FUNCTION public.handle_new_user();

-- RLS
ALTER TABLE public.profiles          ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.classes           ENABLE ROW LEVEL SECURITY;

ALTER TABLE public.user_settings     ENABLE ROW LEVEL SECURITY;

CREATE POLICY "profiles_select_all" ON public.profiles FOR SELECT USING (true);
CREATE POLICY "profiles_insert_own" ON public.profiles FOR INSERT WITH CHECK (auth.uid() = id);
CREATE POLICY "profiles_update_own" ON public.profiles FOR UPDATE USING (auth.uid() = id);

CREATE POLICY "classes_select" ON public.classes FOR SELECT USING (
  guru_id = auth.uid() OR siswa_id = auth.uid()
  OR EXISTS (SELECT 1 FROM public.class_members cm WHERE cm.class_id = classes.id AND cm.siswa_id = auth.uid())
);
CREATE POLICY "classes_insert" ON public.classes FOR INSERT WITH CHECK (guru_id = auth.uid());
CREATE POLICY "classes_update" ON public.classes FOR UPDATE USING (guru_id = auth.uid());
CREATE POLICY "classes_delete" ON public.classes FOR DELETE USING (guru_id = auth.uid());

CREATE POLICY "cm_select" ON public.class_members FOR SELECT USING (
  siswa_id = auth.uid() OR EXISTS (SELECT 1 FROM public.classes c WHERE c.id = class_members.class_id AND c.guru_id = auth.uid())
);
CREATE POLICY "cm_insert" ON public.class_members FOR INSERT WITH CHECK (siswa_id = auth.uid());
CREATE POLICY "cm_delete" ON public.class_members FOR DELETE USING (
  siswa_id = auth.uid() OR EXISTS (SELECT 1 FROM public.classes c WHERE c.id = class_members.class_id AND c.guru_id = auth.uid())
);

CREATE POLICY "materials_select" ON public.materials FOR SELECT USING (
  guru_id = auth.uid() OR (is_active = true AND EXISTS (
    SELECT 1 FROM public.class_members cm WHERE cm.class_id = materials.class_id AND cm.siswa_id = auth.uid()
  ))
);
CREATE POLICY "materials_insert" ON public.materials FOR INSERT WITH CHECK (guru_id = auth.uid());
CREATE POLICY "materials_update" ON public.materials FOR UPDATE USING (guru_id = auth.uid());
CREATE POLICY "materials_delete" ON public.materials FOR DELETE USING (guru_id = auth.uid());

CREATE POLICY "quizzes_select" ON public.quizzes FOR SELECT USING (
  guru_id = auth.uid() OR EXISTS (
    SELECT 1 FROM public.materials m JOIN public.class_members cm ON cm.class_id = m.class_id
    WHERE m.id = quizzes.material_id AND cm.siswa_id = auth.uid() AND m.is_active = true
  )
);
CREATE POLICY "quizzes_insert" ON public.quizzes FOR INSERT WITH CHECK (guru_id = auth.uid());
CREATE POLICY "quizzes_update" ON public.quizzes FOR UPDATE USING (guru_id = auth.uid());
CREATE POLICY "quizzes_delete" ON public.quizzes FOR DELETE USING (guru_id = auth.uid());

CREATE POLICY "submissions_select" ON public.quiz_submissions FOR SELECT USING (
  siswa_id = auth.uid() OR EXISTS (SELECT 1 FROM public.quizzes q WHERE q.id = quiz_submissions.quiz_id AND q.guru_id = auth.uid())
);
CREATE POLICY "submissions_insert" ON public.quiz_submissions FOR INSERT WITH CHECK (siswa_id = auth.uid());

CREATE POLICY "user_settings_own" ON public.user_settings FOR ALL USING (auth.uid() = user_id) WITH CHECK (auth.uid() = user_id);

-- REALTIME
ALTER TABLE public.quiz_submissions REPLICA IDENTITY FULL;
ALTER PUBLICATION supabase_realtime ADD TABLE public.quiz_submissions;

    if (!qz) continue;

/* ═══════════════════════════════════════════════════════════════════════════
   ALPINE APP
   ═══════════════════════════════════════════════════════════════════════════ */
function app() {
  return {
    booting: true,
    mode: 'demo',
    theme: 'dark',
    configHardcoded: false,

    configOpen: false,
    cfg: { supabaseUrl:'', supabaseKey:'', aiProvider:'gemini', aiKey:'', aiModel:'' },
    cfgDraft: {},

    sb: null,
    cloudSession: null,
    _cloudProfile: null,

    demoData: null,
    demoSession: null,
    simRunning: false,
    simTimer: null,
    demoLoginUrl: '',

    authTab: 'demo',
    authMode: 'login',
    authForm: { email:'', password:'', name:'', role:'siswa' },
    authLoading: false,
    authError: '',

    tab: 'classes',
    toasts: [],
    viewingMaterial: null,
    selectedMaterialId: null,

    newClass: { title:'' },
    joinCode: '',
    newMaterial: { class_id:'', title:'', content:'' },
    newQuiz: {
      question: '',
      question_image: '',
      options: ['','','',''],
      option_images: ['','','',''],
      correct_option: 0,
      explanation: ''
    },
    aiQuiz: { topic:'', count:3, loading:false },
    aiMaterial: { topic:'', loading:false },

    uploadingImage: false,
    excelImportOpen: false,
    excelPreview: [],
    excelFileName: '',

    quizAnswers: {},
    quizSubmitted: false,
    quizResults: null,
    score: 0,
    mySubs: [],
    submitting: false,

    classes: [],
    membersByClass: {},
    materials: [],
    quizzes: [],
    submissions: [],
    myClasses: [],

    /* ═══════════════════════════════════════════════════════
       INIT
       ═══════════════════════════════════════════════════════ */
    init() {
      try {
        this.theme = localStorage.getItem('ll_theme') || 'dark';
        this.applyTheme();

        const hardUrl = (window.LIVELEARN_SUPABASE_URL || '').trim();
        const hardKey = (window.LIVELEARN_SUPABASE_KEY || '').trim();
        const hardAiKey = (window.LIVELEARN_AI_KEY || '').trim();

        this.cfg.supabaseUrl = localStorage.getItem('ll_sb_url') || '';
        this.cfg.supabaseKey = localStorage.getItem('ll_sb_key') || '';
        this.cfg.aiProvider  = localStorage.getItem('ll_ai_provider') || 'gemini';
        this.cfg.aiKey       = localStorage.getItem('ll_ai_key') || '';
        this.cfg.aiModel     = localStorage.getItem('ll_ai_model') || '';

        if (hardUrl && hardKey) {
          this.cfg.supabaseUrl = hardUrl;
          this.cfg.supabaseKey = hardKey;
          this.configHardcoded = true;
          this.mode = 'cloud';
          this.authTab = 'cloud';
        } else {
          this.mode = localStorage.getItem('ll_mode') || 'demo';
          this.authTab = this.mode === 'cloud' ? 'cloud' : 'demo';
        }

        if (hardAiKey && !this.cfg.aiKey) this.cfg.aiKey = hardAiKey;

        this.cfgDraft = { ...this.cfg };
        this.demoData = this.loadDemoDb();
        this.demoLoginUrl = this.buildDemoLoginUrl();

        this.checkUrlConfig();

        if (this.mode === 'cloud' && this.cfg.supabaseUrl && this.cfg.supabaseKey && typeof supabase !== 'undefined') {
          this.initCloud();
        } else {
          this.restoreDemoSession();
          this.booting = false;
        }
      } catch (e) {
        console.error('[init]', e);
        this.toast('Gagal inisialisasi: ' + (e?.message || 'unknown'), 'error');
        this.booting = false;
      }
      this.$nextTick(() => this.icons());
    },

    bootWatch() {
      try { this.$watch('tab', () => this.$nextTick(() => this.icons())); } catch(e){}
    },

    icons() { try { if (typeof lucide !== 'undefined') lucide.createIcons(); } catch(e){} },

    applyTheme() {
      try {
        const html = document.documentElement;
        if (this.theme === 'dark') html.classList.add('dark');
        else html.classList.remove('dark');
      } catch(e){}
    },
    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('ll_theme', this.theme); } catch(e){}
      this.applyTheme();
      if (this.mode === 'cloud' && this.cloudSession && this.sb) {
        try {
          this.sb.from('user_settings').upsert({
            user_id: this.cloudSession.user.id,
            theme: this.theme,
            ai_provider: this.cfg.aiProvider,
            ai_model: this.cfg.aiModel,
            updated_at: new Date().toISOString()
          }).then(()=>{});
        } catch(e){}
      }
    },

    /* ═══════════════════════════════════════════════════════
       MODE SWITCH
       ═══════════════════════════════════════════════════════ */
    switchMode(m) {
      if (this.mode === m) return;
      if (m === 'cloud' && this.configHardcoded) {
        this.mode = 'cloud';
        if (!this.sb) this.initCloud();
        return;
      }
      this.mode = m;
      try { localStorage.setItem('ll_mode', m); } catch(e){}
      this.authError = '';

      if (m === 'cloud') {
        if (!this.cfg.supabaseUrl || !this.cfg.supabaseKey) {
          this.configOpen = true;
          this.toast('Isi konfigurasi Supabase untuk Cloud Mode.', 'info');
        } else if (!this.sb) {
          this.initCloud();
        }
      } else {
        this.restoreDemoSession();
      }
    },

    /* ═══════════════════════════════════════════════════════
       DEMO MODE
       ═══════════════════════════════════════════════════════ */
    loadDemoDb() {
      try {
        const raw = localStorage.getItem('ll_demo_db');
        if (!raw) {
          const seeded = seedDemoData();
          localStorage.setItem('ll_demo_db', JSON.stringify(seeded));
          return seeded;
        }
        const parsed = JSON.parse(raw);
        if (!parsed.quiz_submissions) parsed.quiz_submissions = [];
        return parsed;
      } catch (e) {
        const seeded = seedDemoData();
        try { localStorage.setItem('ll_demo_db', JSON.stringify(seeded)); } catch(_) {}
        return seeded;
      }
    },
    saveDemoDb() {
      try { localStorage.setItem('ll_demo_db', JSON.stringify(this.demoData)); } catch(e){}
    },
    restoreDemoSession() {
      try {
        const raw = localStorage.getItem('ll_demo_session');
        if (!raw) { this.demoSession = null; return; }
        const s = JSON.parse(raw);
        const exists = (this.demoData?.profiles || []).find(p => p.id === s.id);
        this.demoSession = exists || null;
        if (!exists) try { localStorage.removeItem('ll_demo_session'); } catch(e){}
      } catch(e) { this.demoSession = null; }
    },
    demoLogin(emailOrId) {
      try {
        const list = this.demoData?.profiles || [];
        const prof = list.find(p => p.id === emailOrId || p.email === emailOrId);
        if (!prof) return this.toast('Akun demo tidak ditemukan.', 'error');
        this.demoSession = prof;
        try { localStorage.setItem('ll_demo_session', JSON.stringify(prof)); } catch(e){}
        this.tab = prof.role === 'guru' ? 'classes' : 'materials';
        this.toast('Selamat datang, ' + prof.name + '!', 'success');
        this.$nextTick(() => {
          this.icons();
          if (prof.role === 'guru') { this.loadGuruData(); this.startSimulation(); }
          else this.loadSiswaData();
        });
      } catch (e) { this.toast('Login gagal: ' + e.message, 'error'); }
    },
    demoLogout() {
      this.demoSession = null;
      try { localStorage.removeItem('ll_demo_session'); } catch(e){}
      this.stopSimulation();
      this.tab = 'classes';
    },
    resetDemoData() {
      if (!confirm('Reset semua data demo ke kondisi awal?')) return;
      try { localStorage.removeItem('ll_demo_db'); } catch(e){}
      this.demoData = this.loadDemoDb();
      this.toast('Data demo direset.', 'success');
    },

    get session() {
      if (this.mode === 'demo') return this.demoSession ? { user: this.demoSession, mode: 'demo' } : null;
      return this.cloudSession;
    },
    get profile() {
      if (this.mode === 'demo') return this.demoSession;
      return this._cloudProfile || null;
    },
    get isGuru() { return this.profile?.role === 'guru'; },
    get demoGurus() { try { return this.demoData?.profiles?.filter(p => p.role === 'guru') || []; } catch(e) { return []; } },
    get demoSiswas() { try { return this.demoData?.profiles?.filter(p => p.role === 'siswa') || []; } catch(e) { return []; } },

    buildDemoLoginUrl() {
      try {
        const origin = window.location.origin;
        let base;
        if (origin && origin !== 'null' && origin !== 'file://') base = origin + window.location.pathname;
        else base = window.location.href.split('#')[0];
        const payload = btoa(JSON.stringify({ mode:'demo', email:'sari@demo.local' }));
        return base + '#demo-login=' + payload;
      } catch(e) { return ''; }
    },

    checkUrlConfig() {
      try {
        const hash = window.location.hash || '';
        const mCfg = hash.match(/cfg=([^&]+)/);
        if (mCfg) {
          try {
            const json = JSON.parse(decodeURIComponent(escape(atob(mCfg[1]))));
            if (json.supabaseUrl && json.supabaseKey) {
              Object.assign(this.cfg, json);
              try {
                localStorage.setItem('ll_sb_url', json.supabaseUrl);
                localStorage.setItem('ll_sb_key', json.supabaseKey);
                if (json.aiKey) localStorage.setItem('ll_ai_key', json.aiKey);
                if (json.aiProvider) localStorage.setItem('ll_ai_provider', json.aiProvider);
                if (json.aiModel) localStorage.setItem('ll_ai_model', json.aiModel);
              } catch(e){}
              this.cfgDraft = { ...this.cfg };
              this.toast('Konfigurasi dimuat dari link.', 'success');
              if (!this.configHardcoded) { this.mode = 'cloud'; this.authTab = 'cloud'; }
            }
          } catch(e) { this.toast('Link config tidak valid.', 'error'); }
          try { history.replaceState(null, '', window.location.pathname); } catch(e){}
        }
        const mDemo = hash.match(/demo-login=([^&]+)/);
        if (mDemo) {
          try {
            const payload = JSON.parse(atob(mDemo[1]));
            if (payload.mode === 'demo') {
              this.mode = 'demo';
              try { localStorage.setItem('ll_mode', 'demo'); } catch(e){}
              this.$nextTick(() => this.demoLogin(payload.email));
            }
          } catch(e){}
          try { history.replaceState(null, '', window.location.pathname); } catch(e){}
        }
      } catch(e) { console.warn('checkUrlConfig:', e); }
    },

    /* ═══════════════════════════════════════════════════════
       CLOUD MODE
       ═══════════════════════════════════════════════════════ */
    initCloud() {
      if (typeof supabase === 'undefined') {
        this.toast('Library Supabase gagal dimuat.', 'error');
        this.booting = false; return;
      }
      if (!this.cfg.supabaseUrl || !this.cfg.supabaseKey) { this.booting = false; return; }
      try {
        this.sb = supabase.createClient(this.cfg.supabaseUrl, this.cfg.supabaseKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        this.sb.auth.getSession().then(({ data }) => {
          this.cloudSession = data?.session || null;
          if (this.cloudSession) this.loadCloudProfile();
          else this.booting = false;
        }).catch(e => {
          this.toast('Auth error: ' + e.message, 'error');
          this.booting = false;
        });
        this.sb.auth.onAuthStateChange((ev, session) => {
          this.cloudSession = session;
          if (session) { if (!this._cloudProfile) this.loadCloudProfile(); }
          else { this._cloudProfile = null; this.booting = false; }
        });
      } catch (e) {
        this.toast('Supabase init gagal: ' + e.message, 'error');
        this.booting = false;
      }
    },
    async loadCloudProfile() {
      try {
        const uid = this.cloudSession.user.id;
        let { data, error } = await this.sb.from('profiles').select('*').eq('id', uid).maybeSingle();
        if (error) throw error;
        if (!data) {
          const meta = this.cloudSession.user.user_metadata || {};
          const ins = {
            id: uid,
            name: meta.name || this.cloudSession.user.email.split('@')[0],
            role: meta.role || 'siswa'
          };
          const { data: created, error: e2 } = await this.sb.from('profiles').insert(ins).select().single();
          if (e2) throw e2;
          data = created;
        }
        this._cloudProfile = data;
        this.booting = false;

        try {
          const { data: st } = await this.sb.from('user_settings').select('*').eq('user_id', uid).maybeSingle();
          if (st) {
            if (st.theme && st.theme !== this.theme) { this.theme = st.theme; this.applyTheme(); }
            if (st.ai_provider) this.cfg.aiProvider = st.ai_provider;
            if (st.ai_model) this.cfg.aiModel = st.ai_model;
          }
        } catch(e){}

        this.$nextTick(() => {
          this.icons();
          if (data.role === 'guru') this.loadGuruData();
          else this.loadSiswaData();
        });
      } catch (e) {
        this.toast('Profil error: ' + e.message, 'error');
        this.booting = false;
      }
    },
    async cloudAuth() {
      this.authError = '';
      this.authLoading = true;
      try {
        if (this.authMode === 'register') {
          if (!this.authForm.name.trim()) throw new Error('Nama wajib diisi.');
          if (this.authForm.password.length < 6) throw new Error('Password min 6 karakter.');
          const { data, error } = await this.sb.auth.signUp({
            email: this.authForm.email.trim(),
            password: this.authForm.password,
            options: { data: { name: this.authForm.name.trim(), role: this.authForm.role } }
          });
          if (error) throw error;
          if (!data.session) {
            this.toast('Cek email untuk verifikasi, lalu login.', 'success');
            this.authMode = 'login';
          }
        } else {
          const { error } = await this.sb.auth.signInWithPassword({
            email: this.authForm.email.trim(), password: this.authForm.password
          });
          if (error) throw error;
        }
      } catch (e) { this.authError = e.message || String(e); }
      finally { this.authLoading = false; }
    },
    async cloudLogout() {
      try { await this.sb.auth.signOut(); } catch(e){}
      this._cloudProfile = null;
      this.cloudSession = null;
    },
    logout() {
      if (!confirm('Yakin logout?')) return;
      if (this.mode === 'demo') this.demoLogout();
      else this.cloudLogout();
    },

    /* ═══════════════════════════════════════════════════════
       CONFIG
       ═══════════════════════════════════════════════════════ */
    openConfig() {
      this.cfgDraft = { ...this.cfg };
      this.configOpen = true;
      this.$nextTick(() => this.icons());
    },
    saveConfig() {
      if (this.configHardcoded) return this.toast('Config dikunci (hardcode di file).', 'info');
      if (!this.cfgDraft.supabaseUrl || !this.cfgDraft.supabaseKey) return this.toast('URL & Anon Key wajib diisi.', 'error');
      try {
        localStorage.setItem('ll_sb_url', this.cfgDraft.supabaseUrl.trim());
        localStorage.setItem('ll_sb_key', this.cfgDraft.supabaseKey.trim());
        localStorage.setItem('ll_ai_provider', this.cfgDraft.aiProvider || 'gemini');
        localStorage.setItem('ll_ai_key', (this.cfgDraft.aiKey || '').trim());
        localStorage.setItem('ll_ai_model', (this.cfgDraft.aiModel || '').trim());
      } catch(e){}
      this.cfg = { ...this.cfgDraft };
      this.configOpen = false;
      this.toast('Konfigurasi tersimpan.', 'success');
      if (this.mode === 'cloud') { this.booting = true; this.initCloud(); }
    },
    exportConfig() {
      try {
        const data = JSON.stringify({
          supabaseUrl: this.cfg.supabaseUrl, supabaseKey: this.cfg.supabaseKey,
          aiProvider: this.cfg.aiProvider, aiKey: this.cfg.aiKey, aiModel: this.cfg.aiModel,
          exportedAt: new Date().toISOString()
        }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'livelearn-config.json'; a.click();

    /* ═══════════════════════════════════════════════════════
       IMAGE UPLOAD
       ═══════════════════════════════════════════════════════ */
    _fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    },
    async uploadImage(file) {
      if (!file.type.startsWith('image/')) throw new Error('File harus gambar.');
      if (file.size > 3 * 1024 * 1024) throw new Error('Ukuran max 3MB.');
      if (this.mode === 'demo') return await this._fileToBase64(file);
      const bucket = 'quiz-images';
      const ext = (file.name.split('.').pop() || 'png').toLowerCase();
      const path = `${this.profile.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await this.sb.storage.from(bucket).upload(path, file, { cacheControl: '3600', upsert: false });
      if (error) throw error;
      const { data: { publicUrl } } = this.sb.storage.from(bucket).getPublicUrl(path);
      return publicUrl;
    },

    parseExcel(ev) {
      const file = ev.target.files?.[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') return this.toast('Library Excel belum dimuat.', 'error');
      this.excelFileName = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
          const letters = ['a','b','c','d','e'];
          const parsed = [];
          for (const raw of rows) {
            const r = {};
            for (const k of Object.keys(raw)) r[k.toLowerCase().trim()] = String(raw[k] ?? '').trim();
            const pertanyaan = r['pertanyaan'];
            if (!pertanyaan) continue;
            const options = [], option_images = [];
            for (const l of letters) {
              const opt = r['opsi_' + l];
              if (opt) { options.push(opt); option_images.push(r['gambar_' + l] || ''); }
            }
            const jawab = (r['jawaban'] || 'A').toUpperCase().trim();
            let correct_option = 0;
            const idx = letters.indexOf(jawab.toLowerCase());
            if (idx >= 0 && idx < options.length) correct_option = idx;
            parsed.push({
              question: pertanyaan,
              question_image: r['gambar_pertanyaan'] || '',
              options, option_images, correct_option,
              explanation: r['penjelasan'] || '',
              _valid: options.length >= 2,
              _error: options.length < 2 ? 'Minimal 2 opsi' : ''
            });
          }
          this.excelPreview = parsed;
          this.excelImportOpen = true;
          if (!parsed.length) this.toast('Tidak ada baris valid.', 'error');
        } catch (err) {
          console.error(err);
          this.toast('Gagal parse Excel: ' + err.message, 'error');
        } finally { ev.target.value = ''; }
      };
      reader.readAsArrayBuffer(file);
    },

    async confirmExcelImport() {
      const valid = this.excelPreview.filter(r => r._valid);
      if (!valid.length) return this.toast('Tidak ada soal valid.', 'error');
      if (!this.selectedMaterialId) return this.toast('Pilih materi dulu.', 'error');
      try {
        let inserted = 0;
        for (const row of valid) {
          await this.dbInsert('quizzes', {
            material_id: this.selectedMaterialId,
            guru_id: this.profile.id,
            question: row.question,
            question_image: row.question_image || null,
            options: row.options,
            option_images: row.option_images,
            correct_option: row.correct_option,
            explanation: row.explanation || '-'
          });
          inserted++;
        }
        this.excelImportOpen = false;
        this.excelPreview = [];
        this.excelFileName = '';
        this.quizzes = await this.fetchQuizzesForMaterial(this.selectedMaterialId);
        this.toast(inserted + ' soal berhasil diimport.', 'success');
      } catch (e) { this.toast('Import gagal: ' + e.message, 'error'); }
    },

    closeExcelImport() {
      this.excelImportOpen = false;
      this.excelPreview = [];
      this.excelFileName = '';
    },

    /* ═══════════════════════════════════════════════════════
       DB ABSTRACTION
       ═══════════════════════════════════════════════════════ */
    async dbInsert(table, record) {
      if (this.mode === 'demo') {
        const rec = {
          id: record.id || (table.slice(0,3) + '-' + Math.random().toString(36).slice(2,9)),
          created_at: new Date().toISOString(),
          ...record
        };
        if (!this.demoData[table]) this.demoData[table] = [];
        this.demoData[table].push(rec);
        this.saveDemoDb();
        return rec;
      }
      const { data, error } = await this.sb.from(table).insert(record).select().single();
      if (error) throw error;
      return data;
    },
    async dbUpdate(table, id, patch) {
      if (this.mode === 'demo') {
        const arr = this.demoData[table] || [];
        const idx = arr.findIndex(r => r.id === id);
        if (idx < 0) throw new Error('Data tidak ditemukan');
        arr[idx] = { ...arr[idx], ...patch };
        this.saveDemoDb();
        return arr[idx];
      }
      const { data, error } = await this.sb.from(table).update(patch).eq('id', id).select().single();
      if (error) throw error;
      return data;
    },
    async dbDelete(table, id) {
      if (this.mode === 'demo') {
        this.demoData[table] = (this.demoData[table] || []).filter(r => r.id !== id);
        if (table === 'classes') {
          this.demoData.class_members = (this.demoData.class_members||[]).filter(m => m.class_id !== id);
          const mats = (this.demoData.materials||[]).filter(m => m.class_id === id).map(m => m.id);
          this.demoData.materials = (this.demoData.materials||[]).filter(m => m.class_id !== id);
          const qzs = (this.demoData.quizzes||[]).filter(q => mats.includes(q.material_id)).map(q => q.id);
          this.demoData.quizzes = (this.demoData.quizzes||[]).filter(q => !mats.includes(q.material_id));
          this.demoData.quiz_submissions = (this.demoData.quiz_submissions||[]).filter(s => !qzs.includes(s.quiz_id));
        } else if (table === 'materials') {
          const qzs = (this.demoData.quizzes||[]).filter(q => q.material_id === id).map(q => q.id);
          this.demoData.quizzes = (this.demoData.quizzes||[]).filter(q => q.material_id !== id);
          this.demoData.quiz_submissions = (this.demoData.quiz_submissions||[]).filter(s => !qzs.includes(s.quiz_id));
        } else if (table === 'quizzes') {
          this.demoData.quiz_submissions = (this.demoData.quiz_submissions||[]).filter(s => s.quiz_id !== id);
        }
        this.saveDemoDb();
        return;
      }
      const { error } = await this.sb.from(table).delete().eq('id', id);
      if (error) throw error;
    },

    /* ═══════════════════════════════════════════════════════
       DATA FETCH
       ═══════════════════════════════════════════════════════ */
    async fetchClassesForGuru() {
      if (this.mode === 'demo') return (this.demoData?.classes || []).filter(c => c.guru_id === this.profile?.id).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      const { data, error } = await this.sb.from('classes').select('*').eq('guru_id', this.profile.id).order('created_at', { ascending:false });
      if (error) throw error;
      return data || [];
    },
    async fetchMembersOfClass(classId) {
      if (this.mode === 'demo') return (this.demoData?.class_members || []).filter(m => m.class_id === classId).map(m => ({ ...m, profiles: (this.demoData?.profiles || []).find(p => p.id === m.siswa_id) }));
      const { data, error } = await this.sb.from('class_members').select('*, profiles:siswa_id(name)').eq('class_id', classId);
      if (error) throw error;
      return data || [];
    },
    async fetchMaterialsForGuru() {
      if (this.mode === 'demo') return (this.demoData?.materials || []).filter(m => m.guru_id === this.profile?.id).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      const { data, error } = await this.sb.from('materials').select('*').eq('guru_id', this.profile.id).order('created_at', { ascending:false });
      if (error) throw error;
      return data || [];
    },
    async fetchActiveMaterials() {
      if (this.mode === 'demo') {
        const myClassIds = (this.demoData?.class_members || []).filter(m => m.siswa_id === this.profile?.id).map(m => m.class_id);
        return (this.demoData?.materials || [])
          .filter(m => m.is_active && myClassIds.includes(m.class_id))
          .map(m => {
            const c = (this.demoData?.classes || []).find(x => x.id === m.class_id);
            const g = (this.demoData?.profiles || []).find(p => p.id === c?.guru_id);
            return { ...m, classes: { ...c, profiles: { name: g?.name || 'Guru' } } };
          })
          .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      }
      const { data, error } = await this.sb.from('materials')
        .select('*, classes:class_id(title, class_code, profiles:guru_id(name))')
        .eq('is_active', true).order('created_at', { ascending: false });
      if (error) throw error;
      return data || [];
    },
    async fetchMyClassesAsSiswa() {
      if (this.mode === 'demo') {
        return (this.demoData?.class_members || [])
          .filter(m => m.siswa_id === this.profile?.id)
          .map(m => {
            const c = (this.demoData?.classes || []).find(x => x.id === m.class_id);
            if (!c) return null;
            const g = (this.demoData?.profiles || []).find(p => p.id === c.guru_id);
            return { ...c, profiles: { name: g?.name || 'Guru' } };
          }).filter(Boolean);
      }
      const { data, error } = await this.sb.from('class_members')
        .select('id, class_id, classes:class_id(id, title, class_code, guru_id, profiles:guru_id(name))')
        .eq('siswa_id', this.profile.id);
      if (error) throw error;
      return (data||[]).map(m => m.classes).filter(Boolean);
    },
    async fetchQuizzesForMaterial(matId) {
      if (this.mode === 'demo') return (this.demoData?.quizzes || []).filter(q => q.material_id === matId).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
      const { data, error } = await this.sb.from('quizzes').select('*').eq('material_id', matId).order('created_at', { ascending:true });
      if (error) throw error;
      return data || [];
    },
    async fetchSubmissionsForGuru() {
      if (this.mode === 'demo') {
        const myMatIds = (this.demoData?.materials || []).filter(m => m.guru_id === this.profile?.id).map(m => m.id);
        const myQzIds = (this.demoData?.quizzes || []).filter(q => myMatIds.includes(q.material_id)).map(q => q.id);
        return (this.demoData?.quiz_submissions || [])
          .filter(s => myQzIds.includes(s.quiz_id))
          .map(s => {
            const q = (this.demoData?.quizzes || []).find(x => x.id === s.quiz_id);
            const m = (this.demoData?.materials || []).find(x => x.id === q?.material_id);
            const c = (this.demoData?.classes || []).find(x => x.id === m?.class_id);
            return {
              ...s,
              profiles: (this.demoData?.profiles || []).find(p => p.id === s.siswa_id),
              quizzes: { ...(q||{}), materials: { ...(m||{}), classes: c } }
            };
          })
          .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))
          .slice(0, 300);
      }
      const { data: myQz, error: e1 } = await this.sb.from('quizzes').select('id').eq('guru_id', this.profile.id);
      if (e1) throw e1;
      const ids = (myQz||[]).map(q => q.id);
      if (!ids.length) return [];
      const { data, error } = await this.sb.from('quiz_submissions')
        .select('*, profiles:siswa_id(name), quizzes:quiz_id(question, material_id, materials:material_id(title, class_id, classes:class_id(title)))')
        .in('quiz_id', ids).order('created_at', { ascending: false }).limit(300);
      if (error) throw error;
      return data || [];
    },
    async fetchMySubmissions(quizIds) {
      if (this.mode === 'demo') return (this.demoData?.quiz_submissions || []).filter(s => s.siswa_id === this.profile?.id && quizIds.includes(s.quiz_id));
      const { data, error } = await this.sb.from('quiz_submissions').select('*').eq('siswa_id', this.profile.id).in('quiz_id', quizIds);
      if (error) throw error;
      return data || [];
    },
    async insertSubmissions(rows) {
      if (this.mode === 'demo') {
        if (!this.demoData.quiz_submissions) this.demoData.quiz_submissions = [];
        for (const r of rows) {
          this.demoData.quiz_submissions.push({
            ...r, id: 'sub-' + Math.random().toString(36).slice(2,9),
            created_at: new Date().toISOString()
          });
        }
        this.saveDemoDb();
        return;
      }
      const { error } = await this.sb.from('quiz_submissions').insert(rows);
      if (error) throw error;
    },

    /* ═══════════════════════════════════════════════════════
       GURU: CLASSES
       ═══════════════════════════════════════════════════════ */
    genCode() {
      const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = ''; for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random()*c.length)];
      return s;
    },
    async createClass() {
      if (!this.newClass.title.trim()) return this.toast('Judul kelas wajib diisi.', 'error');
      try {
        let code = this.genCode();
        for (let i = 0; i < 5; i++) {
          let exist = false;
          if (this.mode === 'demo') exist = (this.demoData?.classes || []).some(c => c.class_code === code);
          else {
            const { data } = await this.sb.from('classes').select('id').eq('class_code', code).maybeSingle();
            exist = !!data;
          }
          if (!exist) break;
          code = this.genCode();
        }
        await this.dbInsert('classes', { guru_id: this.profile.id, siswa_id: null, class_code: code, title: this.newClass.title.trim() });
        this.newClass.title = '';
        this.toast('Kelas dibuat. Kode: ' + code, 'success');
        await this.loadGuruData();
      } catch (e) { this.toast(e.message, 'error'); }
    },
    async deleteClass(id) {
      if (!confirm('Hapus kelas beserta materi & soal?')) return;
      try { await this.dbDelete('classes', id); await this.loadGuruData(); this.toast('Kelas dihapus.', 'success'); }
      catch (e) { this.toast(e.message, 'error'); }
    },
    copyCode(code) {
      navigator.clipboard.writeText(code)
        .then(() => this.toast('Kode disalin: ' + code, 'success'))
        .catch(() => this.toast('Gagal menyalin.', 'error'));
    },

    addOption() {
      if (this.newQuiz.options.length < 6) {
        this.newQuiz.options.push('');
        this.newQuiz.option_images.push('');
      }
    },
    removeOption(i) {
      if (this.newQuiz.options.length <= 2) return;
      this.newQuiz.options.splice(i, 1);
      this.newQuiz.option_images.splice(i, 1);
      if (this.newQuiz.correct_option >= this.newQuiz.options.length) this.newQuiz.correct_option = 0;
    },
    async createQuiz() {
      if (!this.selectedMaterialId) return this.toast('Pilih materi dulu.', 'error');
      const q = this.newQuiz;
      const opts = q.options.map(o => o.trim()).filter(Boolean);
      if (!q.question.trim()) return this.toast('Pertanyaan wajib diisi.', 'error');
      if (opts.length < 2) return this.toast('Minimal 2 opsi.', 'error');
      if (q.correct_option >= opts.length) return this.toast('Jawaban benar tidak valid.', 'error');
      if (!q.explanation.trim()) return this.toast('Penjelasan wajib diisi.', 'error');

      const alignedImages = [];
      for (let i = 0; i < q.options.length; i++) {
        if (q.options[i].trim()) alignedImages.push(q.option_images[i] || '');
      }

      try {
        await this.dbInsert('quizzes', {
          material_id: this.selectedMaterialId,
          guru_id: this.profile.id,
          question: q.question.trim(),
          question_image: q.question_image || null,
          options: opts,
          option_images: alignedImages,
          correct_option: q.correct_option,
          explanation: q.explanation.trim()
        });
        this.newQuiz = {
          question: '', question_image: '',
          options: ['','','',''], option_images: ['','','',''],
          correct_option: 0, explanation: ''
        };
        this.quizzes = await this.fetchQuizzesForMaterial(this.selectedMaterialId);
        this.toast('Soal ditambahkan.', 'success');
      } catch (e) { this.toast(e.message, 'error'); }
    },
    async deleteQuiz(id) {
      if (!confirm('Hapus soal ini?')) return;
      try { await this.dbDelete('quizzes', id); this.quizzes = await this.fetchQuizzesForMaterial(this.selectedMaterialId); }
      catch (e) { this.toast(e.message, 'error'); }
    },

    /* ═══════════════════════════════════════════════════════
       LIVE SIMULATOR
       ═══════════════════════════════════════════════════════ */
    startSimulation() {
      if (this.mode !== 'demo' || this.simRunning) return;
      this.simRunning = true;
      const tick = () => {
        try {
          const allQz = this.demoData?.quizzes || [];
          const allSiswa = (this.demoData?.profiles || []).filter(p => p.role === 'siswa');
          if (!allQz.length || !allSiswa.length) return;
          const qz = allQz[Math.floor(Math.random()*allQz.length)];
          const siswa = allSiswa[Math.floor(Math.random()*allSiswa.length)];
          const ans = Math.floor(Math.random()*4);
          const sub = {
            id: 'sub-' + Math.random().toString(36).slice(2,9),
            quiz_id: qz.id, siswa_id: siswa.id,
            student_answer: ans, is_correct: ans === qz.correct_option,
            created_at: new Date().toISOString()
          };
          if (!this.demoData.quiz_submissions) this.demoData.quiz_submissions = [];
          this.demoData.quiz_submissions.unshift(sub);
          this.saveDemoDb();
          const m = (this.demoData.materials || []).find(x => x.id === qz.material_id);
          const c = (this.demoData.classes || []).find(x => x.id === m?.class_id);
          this.submissions.unshift({
            ...sub, profiles: siswa,
            quizzes: { ...qz, materials: { ...(m||{}), classes: c } }
          });
          this.submissions = this.submissions.slice(0, 300);
        } catch(e) { console.warn('sim:', e); }
      };
      this.simTimer = setInterval(tick, 9000);
      setTimeout(tick, 2500);
    },
    stopSimulation() {
      if (this.simTimer) { clearInterval(this.simTimer); this.simTimer = null; }
      this.simRunning = false;
    },
    toggleSimulation() {
      if (this.simRunning) { this.stopSimulation(); this.toast('Simulasi dihentikan.', 'info'); }
      else { this.startSimulation(); this.toast('Simulasi dimulai.', 'success'); }
    },

    async openMaterial(m) {
      this.viewingMaterial = m;
      this.quizAnswers = {};
      this.quizSubmitted = false;
      this.quizResults = null;
      this.score = 0;
      try {
        this.quizzes = await this.fetchQuizzesForMaterial(m.id);
        if (this.quizzes.length) this.mySubs = await this.fetchMySubmissions(this.quizzes.map(q => q.id));
        else this.mySubs = [];
        this.$nextTick(() => this.icons());
      } catch (e) { this.toast(e.message, 'error'); }

    closeMaterial() {
      this.viewingMaterial = null; this.quizzes = []; this.quizAnswers = {};
      this.quizResults = null; this.mySubs = []; this.quizSubmitted = false;
    },
    async submitQuiz() {
      if (this.submitting) return;
      const unanswered = this.quizzes.filter(q => this.quizAnswers[q.id] === undefined || this.quizAnswers[q.id] === null);
      if (unanswered.length) return this.toast('Masih ada ' + unanswered.length + ' soal belum dijawab.', 'error');
      this.submitting = true;
      try {
        const rows = this.quizzes.map(q => ({
          quiz_id: q.id, siswa_id: this.profile.id,
          student_answer: this.quizAnswers[q.id],
          is_correct: this.quizAnswers[q.id] === q.correct_option
        }));
        await this.insertSubmissions(rows);
        let correct = 0;
        this.quizResults = this.quizzes.map(q => {
          const ok = this.quizAnswers[q.id] === q.correct_option;
          if (ok) correct++;
          return { quiz: q, answer: this.quizAnswers[q.id], correct: ok };
        });
        this.quizSubmitted = true;
        this.score = Math.round((correct / this.quizzes.length) * 100);
        this.toast('Jawaban terkirim! Skor: ' + this.score, 'success');
        this.mySubs = await this.fetchMySubmissions(this.quizzes.map(q => q.id));
      } catch (e) { this.toast('Gagal submit: ' + e.message, 'error'); }
      finally { this.submitting = false; }
    },

    /* ═══════════════════════════════════════════════════════
       AI
       ═══════════════════════════════════════════════════════ */
    async callAI(prompt) {
      if (!this.cfg.aiKey) throw new Error('AI API Key belum diisi.');
      if (this.cfg.aiProvider === 'gemini') {
        const model = this.cfg.aiModel || 'gemini-3.8-flash';
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(this.cfg.aiKey);
        const res = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j?.error?.message || 'Gemini error');
        return j?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
      }
        const model = this.cfg.aiModel || 'qwen/qwen3.8-27b';
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + this.cfg.aiKey
    },
    body: JSON.stringify({
      model,
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.7
    })
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j?.error?.message || 'Groq error');
  return j?.choices?.[0]?.message?.content || '';
},
    parseAIJSON(text) {
      let t = (text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
      const a = t.indexOf('['), o = t.indexOf('{');
      let start = -1;
      if (a === -1) start = o; else if (o === -1) start = a; else start = Math.min(a, o);
      if (start > 0) t = t.slice(start);
      try { return JSON.parse(t); }
      catch {
        const end = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
        if (end > 0) return JSON.parse(t.slice(0, end+1));
        throw new Error('Respons AI bukan JSON valid.');
      }
    },
    async aiGenerateMaterial() {
      if (!this.aiMaterial.topic.trim()) return this.toast('Isi topik materi.', 'error');
      this.aiMaterial.loading = true;
      try {
        if (this.mode === 'demo' && !this.cfg.aiKey) {
          await new Promise(r => setTimeout(r, 700));
          this.newMaterial.content = this._mockMarkdown(this.aiMaterial.topic);
          this.newMaterial.title = this.newMaterial.title || this.aiMaterial.topic;
          this.toast('Materi dibuat (Mock Demo).', 'success');
        } else {
          const prompt = 'Buatkan materi pembelajaran lengkap dalam Bahasa Indonesia dalam format Markdown tentang topik: "' + this.aiMaterial.topic + '". Gunakan heading ##, bullet, contoh, dan kesimpulan. ~400-600 kata. Kembalikan HANYA markdown.';
          this.newMaterial.content = (await this.callAI(prompt)).trim();
          this.newMaterial.title = this.newMaterial.title || this.aiMaterial.topic;
          this.toast('Materi dibuat dengan AI.', 'success');
        }
      } catch (e) { this.toast('AI error: ' + e.message, 'error'); }
      finally { this.aiMaterial.loading = false; }
    },
    async aiGenerateQuiz() {
      if (!this.selectedMaterialId) return this.toast('Pilih materi dulu.', 'error');
      if (!this.aiQuiz.topic.trim()) return this.toast('Isi topik soal.', 'error');
      this.aiQuiz.loading = true;
      try {
        const n = Math.max(1, Math.min(10, parseInt(this.aiQuiz.count)||3));
        let arr;
        if (this.mode === 'demo' && !this.cfg.aiKey) {
          await new Promise(r => setTimeout(r, 900));
          arr = this._mockQuiz(this.aiQuiz.topic, n);
        } else {
          const prompt = 'Buat ' + n + ' soal pilihan ganda Bahasa Indonesia tentang topik: "' + this.aiQuiz.topic + '". Kembalikan HANYA JSON array valid (tanpa code fence): [{"question":"...","options":["...","...","...","..."],"correct_option":0,"explanation":"..."}]';
          arr = this.parseAIJSON(await this.callAI(prompt));
        }
        if (!Array.isArray(arr) || !arr.length) throw new Error('AI tidak mengembalikan array.');
        const rows = arr.map(q => ({
          material_id: this.selectedMaterialId, guru_id: this.profile.id,
          question: String(q.question||'').trim(),
          question_image: '',
          options: (q.options||[]).map(o => String(o).trim()),
          option_images: (q.options||[]).map(()=>''),
          correct_option: Math.max(0, Math.min((q.options||[]).length-1, parseInt(q.correct_option)||0)),
          explanation: String(q.explanation||'').trim() || '-'
        })).filter(r => r.question && r.options.length >= 2);
        if (!rows.length) throw new Error('Soal tidak valid.');
        for (const r of rows) await this.dbInsert('quizzes', r);
        this.quizzes = await this.fetchQuizzesForMaterial(this.selectedMaterialId);
        this.aiQuiz.topic = '';
        this.toast(rows.length + ' soal dibuat.', 'success');
      } catch (e) { this.toast('AI error: ' + e.message, 'error'); }
      finally { this.aiQuiz.loading = false; }
    },
    _mockMarkdown(topic) {
      const t = topic.trim();
      return '# ' + t + '\n\n## Pengertian\n**' + t + '** merupakan topik penting yang perlu dipahami. Secara umum, ' + t + ' dapat didefinisikan sebagai konsep fundamental yang berkaitan dengan berbagai aspek di sekitarnya.\n\n## Poin-Poin Penting\n1. **Konsep dasar** — memahami definisi & istilah kunci\n2. **Karakteristik** — ciri utama yang membedakan\n3. **Penerapan** — bagaimana ' + t + ' digunakan\n4. **Contoh** — ilustrasi konkret\n\n## Penjelasan Detail\nSaat mempelajari ' + t + ', penting memperhatikan hubungan antar-konsep.\n\n> Pemahaman mendalam tentang ' + t + ' memudahkan kaitannya dengan topik terkait.\n\n## Contoh Kasus\n- Kasus 1: penerapan ' + t + ' sehari-hari\n- Kasus 2: analisis sederhana\n- Kasus 3: perbandingan dengan konsep serupa\n\n## Kesimpulan\n' + t + ' adalah topik kaya penerapan praktis.\n\n---\n*Mock Generator (Demo Mode). Isi AI API Key untuk hasil asli.*';
    },
    _mockQuiz(topic, n) {
      const base = [
        { q:'Apa pengertian utama dari "' + topic + '"?', o:['Konsep dasar yang dipelajari','Sesuatu yang tidak berkaitan','Istilah asing tanpa makna','Hanya berlaku di luar negeri'], c:0, e:'"' + topic + '" berkaitan langsung dengan konsep dasar.' },
        { q:'Manakah yang BUKAN ciri "' + topic + '"?', o:['Memiliki karakteristik khusus','Dapat diterapkan','Tidak dapat dipelajari','Berkaitan dengan konsep lain'], c:2, e:'Semua topik dapat dipelajari.' },
        { q:'Cara terbaik memahami "' + topic + '"?', o:['Menghafal tanpa paham','Baca, latih, kaitkan contoh','Hindari latihan','Dengar sekali'], c:1, e:'Pemahaman via membaca, latihan, contoh.' },
        { q:'Mengapa "' + topic + '" penting?', o:['Dapat diterapkan dalam hidup & ujian','Karena disuruh guru','Agar terlihat pintar','Tidak penting'], c:0, e:'Tujuan pembelajaran = penerapan praktis.' },
        { q:'Apa itu penerapan "' + topic + '"?', o:['Menggunakan konsep di situasi nyata','Menghafal definisi saja','Mengabaikan teori','Menyalin pekerjaan'], c:0, e:'Penerapan = penggunaan pada situasi nyata.' }
      ];
      const arr = [];
      for (let i = 0; i < n; i++) {
        const b = base[i % base.length];
        arr.push({ question: b.q, options: b.o, correct_option: b.c, explanation: b.e });
      }
      return arr;
    },

    /* ═══════════════════════════════════════════════════════
       PDF REPORT
       ═══════════════════════════════════════════════════════ */
    async buildReport(classId) {
      const cls = this.classes.find(c => c.id === classId);
      let subs = [];
      if (this.mode === 'demo') {
        const mats = (this.demoData?.materials || []).filter(m => m.class_id === classId);
        const qzs = (this.demoData?.quizzes || []).filter(q => mats.map(m => m.id).includes(q.material_id));
        const qzIds = qzs.map(q => q.id);
        subs = (this.demoData?.quiz_submissions || [])
          .filter(s => qzIds.includes(s.quiz_id))
          .map(s => ({ ...s, profiles: (this.demoData?.profiles || []).find(p => p.id === s.siswa_id) }));
      } else {
        const { data: m } = await this.sb.from('materials').select('id').eq('class_id', classId);
        const matIds = (m||[]).map(x => x.id);
        if (matIds.length) {
          const { data: q } = await this.sb.from('quizzes').select('id').in('material_id', matIds);
          const qIds = (q||[]).map(x => x.id);
          if (qIds.length) {
            const { data: s } = await this.sb.from('quiz_submissions').select('*, profiles:siswa_id(name)').in('quiz_id', qIds);
            subs = s || [];
          }
        }
      }
      const byStudent = {};
      for (const s of subs) {
        const nm = s.profiles?.name || 'Siswa';
        if (!byStudent[nm]) byStudent[nm] = { total:0, correct:0 };
        byStudent[nm].total++;
        if (s.is_correct) byStudent[nm].correct++;
      }
      const memberNames = (this.membersByClass[classId] || []).map(m => m.profiles?.name).filter(Boolean);
      const allNames = Array.from(new Set([...memberNames, ...Object.keys(byStudent)]));
      const rows = allNames.map(nm => {
        const st = byStudent[nm] || { total:0, correct:0 };
        const score = st.total ? Math.round((st.correct / st.total) * 100) : 0;
        return { name: nm, total: st.total, correct: st.correct, score };
      });
      return {
        classTitle: cls?.title || '-', classCode: cls?.class_code || '-',
        rows, generatedAt: new Date().toLocaleString('id-ID')
      };
    },

    /* ═══════════════════════════════════════════════════════

    async migrateDemoToCloud() {
      if (this.mode !== 'cloud' || !this.isGuru) return;
      if (!confirm('Import kelas & materi DEMO ke akun cloud Anda?')) return;
      try {
        const demo = this.loadDemoDb();
        const guruClassIds = ['class-1', 'class-2'];
        let cN = 0, mN = 0, qN = 0;
        for (const oldClass of demo.classes.filter(c => guruClassIds.includes(c.id))) {
          const newCode = this.genCode();
          const { data: newClass, error: e1 } = await this.sb.from('classes').insert({
            guru_id: this.profile.id, title: oldClass.title + ' (imported)', class_code: newCode
          }).select().single();
          if (e1) throw e1;
          cN++;
          for (const mat of demo.materials.filter(m => m.class_id === oldClass.id)) {
            const { data: newMat, error: e2 } = await this.sb.from('materials').insert({
              guru_id: this.profile.id, class_id: newClass.id,
              title: mat.title, content: mat.content, is_active: mat.is_active
            }).select().single();
            if (e2) throw e2;
            mN++;
            for (const qz of demo.quizzes.filter(q => q.material_id === mat.id)) {
              const { error: e3 } = await this.sb.from('quizzes').insert({
                material_id: newMat.id, guru_id: this.profile.id,
                question: qz.question,
                question_image: qz.question_image || null,
                options: qz.options,
                option_images: qz.option_images || [],
                correct_option: qz.correct_option,
                explanation: qz.explanation
              });
              if (e3) throw e3;
              qN++;
            }
          }
        }
        this.toast('Migrasi: ' + cN + ' kelas, ' + mN + ' materi, ' + qN + ' soal.', 'success');
        await this.loadGuruData();
      } catch (e) { this.toast('Migrasi gagal: ' + e.message, 'error'); }
    },

    /* ═══════════════════════════════════════════════════════
       UTILS
       ═══════════════════════════════════════════════════════ */
    toast(msg, type) {
      type = type || 'info';
      const id = Date.now() + Math.random();
      this.toasts.push({ id, msg, type });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 4200);
    },
    renderMD(md) {
      try { return marked.parse(md || ''); }
      catch { return (md || '').replace(/</g,'&lt;'); }
    },
    fmtDate(iso) {
      if (!iso) return '-';
      try { return new Date(iso).toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
      catch(e) { return '-'; }
    }
  };
}
</script>

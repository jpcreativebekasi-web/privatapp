<script>

function seedDemoData() {
  const now = Date.now(), day = 86400000;
  const iso = d => new Date(now - d * day).toISOString();

  const profiles = [
    { id:'guru-1',  email:'sari@demo.local',  name:'Ibu Sari Wulandari', role:'guru',  created_at: iso(30) },
    { id:'guru-2',  email:'budi@demo.local',  name:'Pak Budi Hartono',   role:'guru',  created_at: iso(28) },
    { id:'siswa-1', email:'andi@demo.local',  name:'Andi Pratama',       role:'siswa', created_at: iso(25) },
    { id:'siswa-2', email:'rina@demo.local',  name:'Rina Marlina',       role:'siswa', created_at: iso(24) }
  ];

  const classes = [
    { id:'class-1', guru_id:'guru-1', siswa_id:null, class_code:'MTK01', title:'Matematika Dasar Kelas X', created_at: iso(20) }
  ];

  const class_members = [
    { id:'cm-1', class_id:'class-1', siswa_id:'siswa-1', joined_at: iso(19) },
    { id:'cm-2', class_id:'class-1', siswa_id:'siswa-2', joined_at: iso(19) }
  ];

  const materials = [
    { id:'mat-1', guru_id:'guru-1', class_id:'class-1', is_active:true, created_at: iso(17),
      title:'Persamaan Kuadrat',
      content:`# Persamaan Kuadrat

## Pengertian
Persamaan kuadrat adalah persamaan polinomial berderajat dua dengan bentuk umum **ax² + bx + c = 0** (a ≠ 0).

## Metode Penyelesaian
1. **Faktorisasi** — cari dua bilangan yang hasil kali = a·c dan jumlahnya = b
2. **Melengkapkan Kuadrat Sempurna**
3. **Rumus ABC**: x = (-b ± √(b² - 4ac)) / 2a
4. **Grafik** — titik potong sumbu-x

## Diskriminan (D = b² - 4ac)
- D > 0 → dua akar real berbeda
- D = 0 → satu akar real (kembar)
- D < 0 → tidak ada akar real

## Contoh
x² - 5x + 6 = 0 → (x - 2)(x - 3) = 0 → x = 2 atau x = 3` }
  ];

  const quizzes = [
    { id:'qz-1', material_id:'mat-1', guru_id:'guru-1', created_at: iso(16), type: 'pg', question:'Bentuk umum persamaan kuadrat adalah…', question_image:'', options:['ax + b = 0','ax² + bx + c = 0','ax³ + bx² + cx + d = 0','y = mx + c'], option_images:['','','',''], correct_option:1, explanation:'Persamaan kuadrat selalu berderajat dua.' },
    { id:'qz-2', material_id:'mat-1', guru_id:'guru-1', created_at: iso(16), type: 'essay', question:'Jelaskan apa itu diskriminan dan sebutkan 3 jenis akar berdasarkan diskriminan!', question_image:'', options:[], option_images:[], correct_option:-1, explanation:'Diskriminan adalah D = b²-4ac. Jika D>0 akar real berbeda, D=0 akar kembar, D<0 tidak ada akar real.' }
  ];

  const submissions = [];

  return { profiles, classes, class_members, materials, quizzes, quiz_submissions: submissions };
}

/* ═══════════════════════════════════════════════════════════════════════════
   ALPINE APP
   ═══════════════════════════════════════════════════════════════════════════ */
function app() {
  return {
    booting: true,
    mode: 'demo',
    theme: 'dark',
    configHardcoded: false,

    configOpen: false,
    cfg: { supabaseUrl:'', supabaseKey:'', aiProvider:'gemini', aiKey:'', aiModel:'' },
    cfgDraft: {},

    sb: null,
    cloudSession: null,
    _cloudProfile: null,

    demoData: null,
    demoSession: null,
    simRunning: false,
    simTimer: null,
    demoLoginUrl: '',

    authTab: 'demo',
    authMode: 'login',
    authForm: { email:'', password:'', name:'', role:'siswa' },
    authLoading: false,
    authError: '',

    tab: 'classes',
    toasts: [],
    viewingMaterial: null,
    selectedMaterialId: null,
    editingQuizId: null,
    editingMaterialId: null,

    newClass: { title:'' },
    joinCode: '',
    newMaterial: { class_id:'', title:'', content:'' },
    
    newQuiz: {
      type: 'pg',
      question: '',
      question_image: '',
      options: ['','','',''],
      option_images: ['','','',''],
      correct_option: 0,
      explanation: ''
    },

    aiQuiz: { topic:'', count:3, loading:false },
    aiMaterial: { topic:'', loading:false },

    uploadingImage: false,
    excelImportOpen: false,
    excelPreview: [],
    excelFileName: '',

    quizAnswers: {},
    essayAnswers: {},
    quizSubmitted: false,
    quizResults: null,
    score: 0,
    mySubs: [],
    submitting: false,
    uploadingMaterialImage: false,

    classes: [],
    membersByClass: {},
    materials: [],
    quizzes: [],
    submissions: [],
    myClasses: [],

    init() {
      try {
        this.theme = localStorage.getItem('ll_theme') || 'dark';
        this.applyTheme();

        const hardUrl = (window.LIVELEARN_SUPABASE_URL || '').trim();
        const hardKey = (window.LIVELEARN_SUPABASE_KEY || '').trim();
        const hardAiKey = (window.LIVELEARN_AI_KEY || '').trim();

        this.cfg.supabaseUrl = localStorage.getItem('ll_sb_url') || '';
        this.cfg.supabaseKey = localStorage.getItem('ll_sb_key') || '';
        this.cfg.aiProvider  = localStorage.getItem('ll_ai_provider') || 'gemini';
        this.cfg.aiKey       = localStorage.getItem('ll_ai_key') || '';
        this.cfg.aiModel     = localStorage.getItem('ll_ai_model') || '';

        if (hardUrl && hardKey) {
          this.cfg.supabaseUrl = hardUrl;
          this.cfg.supabaseKey = hardKey;
          this.configHardcoded = true;
          this.mode = 'cloud';
          this.authTab = 'cloud';
        } else {
          this.mode = localStorage.getItem('ll_mode') || 'demo';
          this.authTab = this.mode === 'cloud' ? 'cloud' : 'demo';
        }

        if (hardAiKey && !this.cfg.aiKey) this.cfg.aiKey = hardAiKey;

        this.cfgDraft = { ...this.cfg };
        this.demoData = this.loadDemoDb();
        this.demoLoginUrl = this.buildDemoLoginUrl();

        this.checkUrlConfig();

        if (this.mode === 'cloud' && this.cfg.supabaseUrl && this.cfg.supabaseKey && typeof supabase !== 'undefined') {
          this.initCloud();
        } else {
          this.restoreDemoSession();
          this.booting = false;
        }
      } catch (e) {
        console.error('[init]', e);
        this.toast('Gagal inisialisasi: ' + (e?.message || 'unknown'), 'error');
        this.booting = false;
      }
      this.$nextTick(() => this.icons());
    },

    initQRCode(el) {
      try {
        if (window.QRCode && this.demoLoginUrl) {
          window.QRCode.toCanvas(el, this.demoLoginUrl, { width: 180, margin: 1, color: { dark: '#0c4a6e', light: '#ffffff' } },
            function(err){ if (err) console.warn('QR:', err); });
        }
      } catch(e) { console.warn('QR init:', e); }
    },

    initBarcode(el) {
      try {
        if (window.JsBarcode) {
          window.JsBarcode(el, 'DEMO-GURU-SARI', { format:'CODE128', width:2, height:50, lineColor:'#0c4a6e', background:'#ffffff', displayValue:true, fontSize:12, margin:6 });
        }
      } catch(e) { console.warn('Barcode:', e); }
    },

    bootWatch() {
      try { this.$watch('tab', () => this.$nextTick(() => this.icons())); } catch(e){}
    },

    icons() { try { if (typeof lucide !== 'undefined') lucide.createIcons(); } catch(e){} },

    applyTheme() {
      try {
        const html = document.documentElement;
        if (this.theme === 'dark') html.classList.add('dark');
        else html.classList.remove('dark');
      } catch(e){}
    },
    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('ll_theme', this.theme); } catch(e){}
      this.applyTheme();
    },

    switchMode(m) {
      if (this.mode === m) return;
      if (m === 'cloud' && this.configHardcoded) {
        this.mode = 'cloud';
        if (!this.sb) this.initCloud();
        return;
      }
      this.mode = m;
      try { localStorage.setItem('ll_mode', m); } catch(e){}
      this.authError = '';
      if (m === 'cloud') {
        if (!this.cfg.supabaseUrl || !this.cfg.supabaseKey) {
          this.configOpen = true;
          this.toast('Isi konfigurasi Supabase untuk Cloud Mode.', 'info');
        } else if (!this.sb) {
          this.initCloud();
        }
      } else {
        this.restoreDemoSession();
      }
    },

    loadDemoDb() {
      try {
        const raw = localStorage.getItem('ll_demo_db');
        if (!raw) {
          const seeded = seedDemoData();
          localStorage.setItem('ll_demo_db', JSON.stringify(seeded));
          return seeded;
        }
        const parsed = JSON.parse(raw);
        if (!parsed.quiz_submissions) parsed.quiz_submissions = [];
        return parsed;
      } catch (e) {
        const seeded = seedDemoData();
        try { localStorage.setItem('ll_demo_db', JSON.stringify(seeded)); } catch(_) {}
        return seeded;
      }
    },
    saveDemoDb() {
      try { localStorage.setItem('ll_demo_db', JSON.stringify(this.demoData)); } catch(e){}
    },
    restoreDemoSession() {
      try {
        const raw = localStorage.getItem('ll_demo_session');
        if (!raw) { this.demoSession = null; return; }
        const s = JSON.parse(raw);
        const exists = (this.demoData?.profiles || []).find(p => p.id === s.id);
        this.demoSession = exists || null;
        if (!exists) try { localStorage.removeItem('ll_demo_session'); } catch(e){}
      } catch(e) { this.demoSession = null; }
    },
    demoLogin(emailOrId) {
      try {
        const list = this.demoData?.profiles || [];
        const prof = list.find(p => p.id === emailOrId || p.email === emailOrId);
        if (!prof) return this.toast('Akun demo tidak ditemukan.', 'error');
        this.demoSession = prof;
        try { localStorage.setItem('ll_demo_session', JSON.stringify(prof)); } catch(e){}
        this.tab = prof.role === 'guru' ? 'classes' : 'materials';
        this.toast('Selamat datang, ' + prof.name + '!', 'success');
        this.$nextTick(() => {
          this.icons();
          if (prof.role === 'guru') { this.loadGuruData(); }
          else this.loadSiswaData();
        });
      } catch (e) { this.toast('Login gagal: ' + e.message, 'error'); }
    },
    demoLogout() {
      this.demoSession = null;
      try { localStorage.removeItem('ll_demo_session'); } catch(e){}
      this.tab = 'classes';
    },
    resetDemoData() {
      if (!confirm('Reset semua data demo ke kondisi awal?')) return;
      try { localStorage.removeItem('ll_demo_db'); } catch(e){}
      this.demoData = this.loadDemoDb();
      this.toast('Data demo direset.', 'success');
    },

    get session() {
      if (this.mode === 'demo') return this.demoSession ? { user: this.demoSession, mode: 'demo' } : null;
      return this.cloudSession;
    },
    get profile() {
      if (this.mode === 'demo') return this.demoSession;
      return this._cloudProfile || null;
    },
    get isGuru() { return this.profile?.role === 'guru'; },
    get demoGurus() { try { return this.demoData?.profiles?.filter(p => p.role === 'guru') || []; } catch(e) { return []; } },
    get demoSiswas() { try { return this.demoData?.profiles?.filter(p => p.role === 'siswa') || []; } catch(e) { return []; } },

    buildDemoLoginUrl() {
      try {
        const origin = window.location.origin;
        let base;
        if (origin && origin !== 'null' && origin !== 'file://') base = origin + window.location.pathname;
        else base = window.location.href.split('#')[0];
        const payload = btoa(JSON.stringify({ mode:'demo', email:'sari@demo.local' }));
        return base + '#demo-login=' + payload;
      } catch(e) { return ''; }
    },

    checkUrlConfig() {
      try {
        const hash = window.location.hash || '';
        const mCfg = hash.match(/cfg=([^&]+)/);
        if (mCfg) {
          try {
            const json = JSON.parse(decodeURIComponent(escape(atob(mCfg[1]))));
            if (json.supabaseUrl && json.supabaseKey) {
              Object.assign(this.cfg, json);
              try {
                localStorage.setItem('ll_sb_url', json.supabaseUrl);
                localStorage.setItem('ll_sb_key', json.supabaseKey);
              } catch(e){}
              this.cfgDraft = { ...this.cfg };
              this.toast('Konfigurasi dimuat dari link.', 'success');
              if (!this.configHardcoded) { this.mode = 'cloud'; this.authTab = 'cloud'; }
            }
          } catch(e) { this.toast('Link config tidak valid.', 'error'); }
          try { history.replaceState(null, '', window.location.pathname); } catch(e){}
        }
      } catch(e) { console.warn('checkUrlConfig:', e); }
    },

    initCloud() {
      if (typeof supabase === 'undefined') {
        this.toast('Library Supabase gagal dimuat.', 'error');
        this.booting = false; return;
      }
      if (!this.cfg.supabaseUrl || !this.cfg.supabaseKey) { this.booting = false; return; }
      try {
        this.sb = supabase.createClient(this.cfg.supabaseUrl, this.cfg.supabaseKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        this.sb.auth.getSession().then(({ data }) => {
          this.cloudSession = data?.session || null;
          if (this.cloudSession) this.loadCloudProfile();
          else this.booting = false;
        }).catch(e => {
          this.toast('Auth error: ' + e.message, 'error');
          this.booting = false;
        });
        this.sb.auth.onAuthStateChange((ev, session) => {
          this.cloudSession = session;

      if (file.size > 3 * 1024 * 1024) throw new Error('Ukuran max 3MB.');
      if (this.mode === 'demo') return await this._fileToBase64(file);
      const bucket = 'quiz-images';
      const ext = (file.name.split('.').pop() || 'png').toLowerCase();
      const path = `${this.profile.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await this.sb.storage.from(bucket).upload(path, file, { cacheControl: '3600', upsert: false });
      if (error) throw error;
      const { data: { publicUrl } } = this.sb.storage.from(bucket).getPublicUrl(path);
      return publicUrl;
    },

    downloadExcelTemplate() {
      if (typeof XLSX === 'undefined') return this.toast('Library Excel belum dimuat.', 'error');
      const ws_data = [
        ['pertanyaan','gambar_pertanyaan','opsi_a','gambar_a','opsi_b','gambar_b','opsi_c','gambar_c','opsi_d','gambar_d','jawaban','penjelasan'],
        ['Berapa hasil dari 2 + 2?','','3','','4','','5','','6','','B','Hasil penjumlahan 2 + 2 adalah 4.']
      ];
      const ws = XLSX.utils.aoa_to_sheet(ws_data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Soal');
      XLSX.writeFile(wb, 'template-soal-livelearn.xlsx');
      this.toast('Template Excel didownload.', 'success');

    parseExcel(ev) {
      const file = ev.target.files?.[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') return this.toast('Library Excel belum dimuat.', 'error');
      this.excelFileName = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
          const letters = ['a','b','c','d','e'];
          const parsed = [];
          for (const raw of rows) {
            const r = {};
            for (const k of Object.keys(raw)) r[k.toLowerCase().trim()] = String(raw[k] ?? '').trim();
            const pertanyaan = r['pertanyaan'];
            if (!pertanyaan) continue;
            const options = [], option_images = [];
            for (const l of letters) {
              const opt = r['opsi_' + l];
              if (opt) { options.push(opt); option_images.push(r['gambar_' + l] || ''); }
            }
            const jawab = (r['jawaban'] || 'A').toUpperCase().trim();
            let correct_option = 0;
            const idx = letters.indexOf(jawab.toLowerCase());
            if (idx >= 0 && idx < options.length) correct_option = idx;
            parsed.push({
              type: 'pg',
              question: pertanyaan,
              question_image: r['gambar_pertanyaan'] || '',
              options, option_images, correct_option,
              explanation: r['penjelasan'] || '',
              _valid: options.length >= 2,
              _error: options.length < 2 ? 'Minimal 2 opsi' : ''
            });
          }
          this.excelPreview = parsed;
          this.excelImportOpen = true;
        } catch (err) {
          this.toast('Gagal parse Excel: ' + err.message, 'error');
        } finally { ev.target.value = ''; }
      };
      reader.readAsArrayBuffer(file);
    },

    async confirmExcelImport() {
      const valid = this.excelPreview.filter(r => r._valid);
      if (!valid.length) return this.toast('Tidak ada soal valid.', 'error');
      if (!this.selectedMaterialId) return this.toast('Pilih materi dulu.', 'error');
      try {
        let inserted = 0;
        for (const row of valid) {
          await this.dbInsert('quizzes', {
            material_id: this.selectedMaterialId,
            guru_id: this.profile.id,
            type: 'pg',
            question: row.question,
            question_image: row.question_image || null,
            options: row.options,
            option_images: row.option_images,
            correct_option: row.correct_option,
            explanation: row.explanation || '-'
          });
          inserted++;
        }
        this.excelImportOpen = false;
        this.excelPreview = [];
        this.excelFileName = '';
        this.quizzes = await this.fetchQuizzesForMaterial(this.selectedMaterialId);
        this.toast(inserted + ' soal berhasil diimport.', 'success');
      } catch (e) { this.toast('Import gagal: ' + e.message, 'error'); }
    },

    async dbInsert(table, record) {
      if (this.mode === 'demo') {
        const rec = {
          id: record.id || (table.slice(0,3) + '-' + Math.random().toString(36).slice(2,9)),
          created_at: new Date().toISOString(),
          ...record
        };
        if (!this.demoData[table]) this.demoData[table] = [];
        this.demoData[table].push(rec);
        this.saveDemoDb();
        return rec;
      }
      const { data, error } = await this.sb.from(table).insert(record).select().single();
      if (error) throw error;
      return data;
    },
    async dbUpdate(table, id, patch) {
      if (this.mode === 'demo') {
        const arr = this.demoData[table] || [];
        const idx = arr.findIndex(r => r.id === id);
        if (idx < 0) throw new Error('Data tidak ditemukan');
        arr[idx] = { ...arr[idx], ...patch };
        this.saveDemoDb();
        return arr[idx];
      }
      const { data, error } = await this.sb.from(table).update(patch).eq('id', id).select().single();
      if (error) throw error;
      return data;
    },
    async dbDelete(table, id) {
      if (this.mode === 'demo') {
        this.demoData[table] = (this.demoData[table] || []).filter(r => r.id !== id);
        if (table === 'classes') {
          this.demoData.class_members = (this.demoData.class_members||[]).filter(m => m.class_id !== id);
          const mats = (this.demoData.materials||[]).filter(m => m.class_id === id).map(m => m.id);
          this.demoData.materials = (this.demoData.materials||[]).filter(m => m.class_id !== id);
          const qzs = (this.demoData.quizzes||[]).filter(q => mats.includes(q.material_id)).map(q => q.id);
          this.demoData.quizzes = (this.demoData.quizzes||[]).filter(q => !mats.includes(q.material_id));
          this.demoData.quiz_submissions = (this.demoData.quiz_submissions||[]).filter(s => !qzs.includes(s.quiz_id));
        } else if (table === 'materials') {
          const qzs = (this.demoData.quizzes||[]).filter(q => q.material_id === id).map(q => q.id);
          this.demoData.quizzes = (this.demoData.quizzes||[]).filter(q => q.material_id !== id);
          this.demoData.quiz_submissions = (this.demoData.quiz_submissions||[]).filter(s => !qzs.includes(s.quiz_id));
        } else if (table === 'quizzes') {
          this.demoData.quiz_submissions = (this.demoData.quiz_submissions||[]).filter(s => s.quiz_id !== id);
        }
        this.saveDemoDb();
        return;
      }
      const { error } = await this.sb.from(table).delete().eq('id', id);
      if (error) throw error;
    },

    async fetchSubmissionsForGuru() {
      if (this.mode === 'demo') {
        const myMatIds = (this.demoData?.materials || []).filter(m => m.guru_id === this.profile?.id).map(m => m.id);
        const myQzIds = (this.demoData?.quizzes || []).filter(q => myMatIds.includes(q.material_id)).map(q => q.id);
        return (this.demoData?.quiz_submissions || [])
          .filter(s => myQzIds.includes(s.quiz_id))
          .map(s => {
            const q = (this.demoData?.quizzes || []).find(x => x.id === s.quiz_id);
            const m = (this.demoData?.materials || []).find(x => x.id === q?.material_id);
            const c = (this.demoData?.classes || []).find(x => x.id === m?.class_id);
            return {
              ...s,
              profiles: (this.demoData?.profiles || []).find(p => p.id === s.siswa_id),
              quizzes: { ...(q||{}), materials: { ...(m||{}), classes: c } }
            };
          })
          .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))
          .slice(0, 300);
      }
      const { data: myQz, error: e1 } = await this.sb.from('quizzes').select('id').eq('guru_id', this.profile.id);
      if (e1) throw e1;
      const ids = (myQz||[]).map(q => q.id);
      if (!ids.length) return [];
      const { data, error } = await this.sb.from('quiz_submissions')
        .select('*, profiles:siswa_id(name), quizzes:quiz_id(question, material_id, type, materials:material_id(title, class_id, classes:class_id(title)))')
        .in('quiz_id', ids).order('created_at', { ascending: false }).limit(300);
      if (error) throw error;
      return data || [];

    handleMaterialUpload(ev) {
      const file = ev.target.files?.[0];
      if (!file) return;

      if (file.type === 'application/pdf') {
        if (typeof pdfjsLib === 'undefined') {
          this.toast('Library PDF belum termuat.', 'error');
          return;
        }
        this.toast('Mengekstrak teks dari PDF...', 'info');
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const typedarray = new Uint8Array(e.target.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              const pageText = textContent.items.map(item => item.str).join(' ');
              fullText += pageText + '\n\n';
            }
            this.newMaterial.content = fullText.trim();
            if (!this.newMaterial.title.trim()) this.newMaterial.title = file.name.replace(/\.[^/.]+$/, "");
            this.toast('Teks PDF berhasil dimuat.', 'success');
          } catch (err) {
            this.toast('Gagal membaca PDF: ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            this.newMaterial.content = e.target.result;
            if (!this.newMaterial.title.trim()) this.newMaterial.title = file.name.replace(/\.[^/.]+$/, "");
            this.toast('File materi berhasil dimuat.', 'success');
          } catch (err) { this.toast('Gagal membaca file: ' + err.message, 'error'); }
        };
        reader.readAsText(file);
      }
      ev.target.value = '';
    },

        if (this.editingMaterialId) {
          await this.dbUpdate('materials', this.editingMaterialId, {
            title: f.title.trim(), content: f.content.trim()
          });
          this.toast('Materi diupdate.', 'success');
          this.editingMaterialId = null;
        } else {
          await this.dbInsert('materials', {
            guru_id: this.profile.id, class_id: f.class_id,
            title: f.title.trim(), content: f.content.trim(), is_active: false
          });
          this.toast('Materi ditambahkan.', 'success');
        }
        this.newMaterial = { class_id: f.class_id, title:'', content:'' };
        await this.loadGuruData();
      } catch (e) { this.toast(e.message, 'error'); }
    },
    async toggleMaterialActive(m) {
      try { 
        await this.dbUpdate('materials', m.id, { is_active: !m.is_active }); 
        await this.loadGuruData(); 
        this.toast(m.is_active ? 'Materi Dikunci (Siswa tidak bisa buka).' : 'Materi Dibuka (Siswa bisa buka).', 'info');
      } catch (e) { this.toast(e.message, 'error'); }
    },
    async deleteMaterial(id) {
      if (!confirm('Hapus materi beserta soal?')) return;
      try { await this.dbDelete('materials', id); if (this.selectedMaterialId === id) this.selectedMaterialId = null; await this.loadGuruData(); this.toast('Materi dihapus.', 'success'); }
      catch (e) { this.toast(e.message, 'error'); }
    },
    async selectMaterial(id) {
      this.selectedMaterialId = id;
      try { this.quizzes = await this.fetchQuizzesForMaterial(id); } catch(e){ this.quizzes = []; }
      this.$nextTick(() => this.icons());
    },

    addOption() {
      if (this.newQuiz.options.length < 6) {
        this.newQuiz.options.push('');
        this.newQuiz.option_images.push('');
      }
    },
    removeOption(i) {
      if (this.newQuiz.options.length <= 2) return;
      this.newQuiz.options.splice(i, 1);
      this.newQuiz.option_images.splice(i, 1);
      if (this.newQuiz.correct_option >= this.newQuiz.options.length) this.newQuiz.correct_option = 0;
    },
    
    async createQuiz() {
      if (!this.selectedMaterialId) return this.toast('Pilih materi dulu.', 'error');
      const q = this.newQuiz;
      if (!q.question.trim()) return this.toast('Pertanyaan wajib diisi.', 'error');
      if (!q.explanation.trim()) return this.toast('Penjelasan wajib diisi.', 'error');

      let opts = [], alignedImages = [], correctIdx = 0;
      if (q.type === 'pg') {
        opts = q.options.map(o => o.trim()).filter(Boolean);
        if (opts.length < 2) return this.toast('Minimal 2 opsi.', 'error');
        if (q.correct_option >= opts.length) return this.toast('Jawaban benar tidak valid.', 'error');
        correctIdx = q.correct_option;
        for (let i = 0; i < q.options.length; i++) {
          if (q.options[i].trim()) alignedImages.push(q.option_images[i] || '');
        }
      }

      try {
        if (this.editingQuizId) {
          await this.dbUpdate('quizzes', this.editingQuizId, {
            type: q.type,
            question: q.question.trim(),
            question_image: q.question_image || null,
            options: opts,
            option_images: alignedImages,
            correct_option: q.type === 'essay' ? -1 : correctIdx,
            explanation: q.explanation.trim()
          });
          this.toast('Soal berhasil diupdate.', 'success');
          this.editingQuizId = null;
        } else {
          await this.dbInsert('quizzes', {
            material_id: this.selectedMaterialId,
            guru_id: this.profile.id,
            type: q.type,
            question: q.question.trim(),
            question_image: q.question_image || null,
            options: opts,
            option_images: alignedImages,
            correct_option: q.type === 'essay' ? -1 : correctIdx,
            explanation: q.explanation.trim()
          });
          this.toast('Soal ditambahkan.', 'success');
        }

        this.newQuiz = {
          type: 'pg', question: '', question_image: '',
          options: ['','','',''], option_images: ['','','',''],
          correct_option: 0, explanation: ''
        };
        this.quizzes = await this.fetchQuizzesForMaterial(this.selectedMaterialId);
      } catch (e) { this.toast(e.message, 'error'); }
    },
    editQuiz(q) {
      this.editingQuizId = q.id;
      this.newQuiz = {
        type: q.type || 'pg',
        question: q.question,
        question_image: q.question_image || '',
        options: q.options.length ? [...q.options] : ['','','',''],
        option_images: q.option_images ? [...q.option_images] : ['','','',''],
        correct_option: q.correct_option,
        explanation: q.explanation
      };
      setTimeout(() => {
        const formEl = document.getElementById('quiz-form');
        if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    },
    cancelEditQuiz() {
      this.editingQuizId = null;
      this.newQuiz = {
        type: 'pg', question: '', question_image: '',
        options: ['','','',''], option_images: ['','','',''],
        correct_option: 0, explanation: ''
      };
    },
    async deleteQuiz(id) {
      if (!confirm('Hapus soal ini?')) return;
      try { await this.dbDelete('quizzes', id); this.quizzes = await this.fetchQuizzesForMaterial(this.selectedMaterialId); }
      catch (e) { this.toast(e.message, 'error'); }
    },

    async joinClass() {
      const code = (this.joinCode||'').trim().toUpperCase();
      if (!code) return this.toast('Masukkan kode kelas.', 'error');
      try {
        let cls;
        if (this.mode === 'demo') cls = (this.demoData?.classes || []).find(c => c.class_code === code);
        else {
          const { data, error } = await this.sb.from('classes').select('*').eq('class_code', code).maybeSingle();
          if (error) throw error; cls = data;
        }
        if (!cls) return this.toast('Kode tidak ditemukan.', 'error');

        if (this.mode === 'demo') {
          const dup = (this.demoData.class_members || []).find(m => m.class_id === cls.id && m.siswa_id === this.profile.id);
          if (dup) return this.toast('Sudah tergabung di kelas ini.', 'info');
          await this.dbInsert('class_members', { class_id: cls.id, siswa_id: this.profile.id, joined_at: new Date().toISOString() });
        } else {
          const { error: e2 } = await this.sb.from('class_members').insert({ class_id: cls.id, siswa_id: this.profile.id });
          if (e2) {
            if ((e2.message||'').toLowerCase().includes('duplicate')) return this.toast('Sudah tergabung.', 'info');
            throw e2;
          }
        }
        this.joinCode = '';
        this.toast('Berhasil join: ' + cls.title, 'success');
        await this.loadSiswaData();
      } catch (e) { this.toast(e.message, 'error'); }
    },
    
    async openMaterial(m) {
      if (m.is_active === false) return this.toast('Materi ini masih terkunci oleh guru.', 'error');
      this.viewingMaterial = m;
      this.quizAnswers = {};
      this.essayAnswers = {};
      this.quizSubmitted = false;
      this.quizResults = null;
      this.score = 0;
      try {
        this.quizzes = await this.fetchQuizzesForMaterial(m.id);
        if (this.quizzes.length) this.mySubs = await this.fetchMySubmissions(this.quizzes.map(q => q.id));
        else this.mySubs = [];
        this.$nextTick(() => this.icons());
      } catch (e) { this.toast(e.message, 'error'); }
    },
    closeMaterial() {
      this.viewingMaterial = null; this.quizzes = []; this.quizAnswers = {}; this.essayAnswers = {};
      this.quizResults = null; this.mySubs = []; this.quizSubmitted = false;
    },
    
    async liveSubmitPg(quizId, answerIdx) {
      if (this.quizSubmitted) return;
      const q = this.quizzes.find(x => x.id === quizId);
      try {
        const row = {
          quiz_id: quizId, 
          siswa_id: this.profile.id,
          student_answer: answerIdx,
          is_correct: answerIdx === q.correct_option
        };
        if (this.mode === 'demo') {
          if (!this.demoData.quiz_submissions) this.demoData.quiz_submissions = [];
          this.demoData.quiz_submissions = this.demoData.quiz_submissions.filter(s => !(s.quiz_id === quizId && s.siswa_id === this.profile.id));
          this.demoData.quiz_submissions.push({ ...row, id: 'sub-'+Math.random().toString(36).slice(2,9), created_at: new Date().toISOString() });
          this.saveDemoDb();
        } else {
          await this.sb.from('quiz_submissions').delete().match({ quiz_id: quizId, siswa_id: this.profile.id });
          await this.sb.from('quiz_submissions').insert(row);
        }
      } catch(e) { console.warn('Live submit error', e); }
    },

    async saveEssay(quizId) {
      const answer = this.essayAnswers[quizId];
      if (!answer || !answer.trim()) return this.toast('Jawaban esai tidak boleh kosong.', 'error');
      try {
        const row = {
          quiz_id: quizId, 
          siswa_id: this.profile.id,
          student_answer: 0,
          is_correct: false
        };
        if (this.mode === 'demo') {
          if (!this.demoData.quiz_submissions) this.demoData.quiz_submissions = [];
          this.demoData.quiz_submissions = this.demoData.quiz_submissions.filter(s => !(s.quiz_id === quizId && s.siswa_id === this.profile.id));
          this.demoData.quiz_submissions.push({ ...row, answer_text: answer, id: 'sub-'+Math.random().toString(36).slice(2,9), created_at: new Date().toISOString() });
          this.saveDemoDb();
        } else {
          await this.sb.from('quiz_submissions').delete().match({ quiz_id: quizId, siswa_id: this.profile.id });
          await this.sb.from('quiz_submissions').insert({ ...row, student_answer: answer }); 
        }
        this.toast('Jawaban esai tersimpan.', 'success');
      } catch(e) { this.toast('Gagal simpan esai: ' + e.message, 'error'); }
    },

    async submitQuiz() {
      if (this.submitting) return;
      const unansweredPg = this.quizzes.filter(q => q.type === 'pg' && (this.quizAnswers[q.id] === undefined || this.quizAnswers[q.id] === null));
      if (unansweredPg.length) return this.toast('Masih ada ' + unansweredPg.length + ' soal PG belum dijawab.', 'error');
      
      this.submitting = true;
      try {
        let correct = 0;
        this.quizResults = this.quizzes.map(q => {
          let ok = false;
          if (q.type === 'pg') {
            ok = this.quizAnswers[q.id] === q.correct_option;
            if (ok) correct++;
          }
          return { quiz: q, answer: this.quizAnswers[q.id] || this.essayAnswers[q.id], correct: ok };
        });
        
        this.quizSubmitted = true;
        this.score = Math.round((correct / this.quizzes.filter(q=>q.type==='pg').length) * 100);
        this.toast('Jawaban terkirim! Skor PG: ' + this.score, 'success');
        this.mySubs = await this.fetchMySubmissions(this.quizzes.map(q => q.id));
      } catch (e) { this.toast('Gagal submit: ' + e.message, 'error'); }
      finally { this.submitting = false; }
    },

    async printStudentResult() {
      if (typeof html2pdf === 'undefined') return this.toast('Library PDF belum siap.', 'error');
      let html = '<div style="font-family:Inter,sans-serif;padding:28px;color:#0f172a">';
      html += '<div style="text-align:center; border-bottom:3px solid #0284c7; padding-bottom:12px; margin-bottom:20px">';
      html += '<div style="font-size:24px;font-weight:900;color:#0284c7">LiveLearn — Hasil Tes</div>';
      html += '<div style="font-size:14px; margin-top:5px;">Nama: <b>' + this.profile.name + '</b> | Kelas: ' + this.viewingMaterial.classes.title + '</div>';
      html += '<div style="font-size:14px;">Materi: <b>' + this.viewingMaterial.title + '</b> | Skor PG: <b style="color:#ea580c;font-size:18px;">' + this.score + '</b></div>';
      html += '</div>';

      for (let i = 0; i < this.quizzes.length; i++) {
        const q = this.quizzes[i];
        const userAns = this.quizAnswers[q.id];
        const userEssay = this.essayAnswers[q.id];
        const isCorrect = q.type === 'pg' ? (userAns === q.correct_option) : null;
        
        html += '<div style="margin-bottom:15px; padding:12px; border:1px solid #cbd5e1; border-radius:8px; background:' + (isCorrect === true ? '#f0fdf4' : isCorrect === false ? '#fef2f2' : '#f8fafc') + '">';
        html += '<div style="font-weight:bold; margin-bottom:8px;">' + (i+1) + '. ' + q.question + ' <span style="font-size:10px; color:#64748b; font-weight:normal;">(' + (q.type === 'pg' ? 'Pilihan Ganda' : 'Uraian') + ')</span></div>';
        
        if (q.type === 'pg') {
          html += '<div style="font-size:12px; color:#475569;">Jawaban Anda: <b>' + (userAns !== undefined ? q.options[userAns] : 'Tidak dijawab') + '</b></div>';
          if (!isCorrect) html += '<div style="font-size:12px; color:#059669;">Jawaban Benar: <b>' + q.options[q.correct_option] + '</b></div>';
        } else {
          html += '<div style="font-size:12px; color:#475569;">Jawaban Anda: <i>' + (userEssay || 'Tidak dijawab') + '</i></div>';
          html += '<div style="font-size:12px; color:#059669;">Kunci: <i>' + q.explanation + '</i></div>';
        }
        html += '</div>';
      }
      html += '</div>';

      const wrap = document.createElement('div');
      wrap.innerHTML = html;
      await html2pdf().set({
        margin: 0, filename: 'Hasil_Tes_' + this.profile.name + '.pdf',
        image: { type:'jpeg', quality:0.98 }, html2canvas: { scale:2 }, jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
      }).from(wrap).save();
    },

    async exportReportPDF(classId) {
      if (typeof html2pdf === 'undefined') return this.toast('Library PDF belum siap.', 'error');
      const cls = this.classes.find(c => c.id === classId);
      let html = '<div style="font-family:Inter,sans-serif;padding:28px;color:#0f172a">';
      html += '<div style="border-bottom:3px solid #0284c7;padding-bottom:12px;margin-bottom:18px"><div style="font-size:22px;font-weight:800;color:#0284c7">LiveLearn — Laporan Per Siswa</div>';
      html += '<div style="font-size:12px;color:#64748b">Kelas: ' + (cls?.title || '-') + ' · Kode: ' + (cls?.class_code || '-') + '</div></div>';

      const members = this.membersByClass[classId] || [];
      for (const m of members) {
        const namaSiswa = m.profiles?.name || 'Siswa';
        const subs = (this.demoData?.quiz_submissions || []).filter(s => s.siswa_id === m.siswa_id);
        
        html += '<div style="margin-bottom:20px; padding:15px; border:1px solid #cbd5e1; border-radius:8px; background:#f8fafc">';
        html += '<div style="font-size:16px; font-weight:bold; color:#0c4a6e; margin-bottom:10px;">Nama Siswa: ' + namaSiswa + '</div>';
        
        if (!subs.length) {
          html += '<div style="font-size:12px; color:#ef4444;">Belum mengerjakan kuis apapun.</div>';
        } else {
          html += '<table style="width:100%; border-collapse:collapse; font-size:11px;">';
          html += '<tr style="background:#e0f2fe;"><th style="padding:6px;border:1px solid #bae6fd;">Soal</th><th style="padding:6px;border:1px solid #bae6fd;">Tipe</th><th style="padding:6px;border:1px solid #bae6fd;">Jawaban</th><th style="padding:6px;border:1px solid #bae6fd;">Hasil</th></tr>';
          
          for (const s of subs) {
            const q = this.demoData.quizzes.find(x => x.id === s.quiz_id);
            if (!q) continue;
            const ans = q.type === 'essay' ? 'Esai: ' + (s.answer_text || s.student_answer) : q.options[s.student_answer];
            html += '<tr>';
            html += '<td style="padding:6px;border:1px solid #e2e8f0;">' + q.question + '</td>';
            html += '<td style="padding:6px;border:1px solid #e2e8f0; text-align:center;">' + (q.type === 'essay' ? 'Esai' : 'PG') + '</td>';
            html += '<td style="padding:6px;border:1px solid #e2e8f0;">' + ans + '</td>';
            html += '<td style="padding:6px;border:1px solid #e2e8f0; text-align:center; font-weight:bold; color:' + (s.is_correct ? '#059669' : q.type==='essay'?'#64748b':'#dc2626') + '">' + (q.type === 'essay' ? 'Perlu Dinilai' : (s.is_correct ? 'BENAR' : 'SALAH')) + '</td>';
            html += '</tr>';
          }
          html += '</table>';
        }
        html += '</div>';
      }
      html += '</div>';

      const wrap = document.createElement('div');
      wrap.innerHTML = html;
      try {
        await html2pdf().set({
          margin: 0, filename: 'Laporan_Siswa_' + cls.class_code + '.pdf',
          image: { type:'jpeg', quality:0.98 }, html2canvas: { scale:2, useCORS:true }, jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
        }).from(wrap).save();
        this.toast('PDF Per Siswa dibuat.', 'success');
      } catch (e) { this.toast('PDF gagal: ' + e.message, 'error'); }
    },

    // FITUR AI
    async callAI(prompt) {
      if (!this.cfg.aiKey) throw new Error('AI API Key belum diisi. Buka menu Settings (ikon gerigi).');
      if (this.cfg.aiProvider === 'gemini') {
        const model = this.cfg.aiModel || 'gemini-1.5-flash'; 
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(this.cfg.aiKey);
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
        const j = await res.json();
        if (!res.ok) throw new Error(j?.error?.message || 'Gemini error');
        return j?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
      }
      const model = this.cfg.aiModel || 'qwen/qwen3.8-27b'; 
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.cfg.aiKey },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0.7 })
      });
      const j = await res.json();
      if (!res.ok) throw new Error(j?.error?.message || 'Groq error');
      return j?.choices?.[0]?.message?.content || '';
    },
    async aiGenerateMaterial() {
      if (!this.aiMaterial.topic.trim()) return this.toast('Isi topik materi.', 'error');
      this.aiMaterial.loading = true;
      try {
        const prompt = 'Buatkan materi pembelajaran lengkap dalam Bahasa Indonesia dalam format Markdown tentang topik: "' + this.aiMaterial.topic + '". Gunakan heading ##, bullet, contoh, dan kesimpulan. ~400-600 kata. Kembalikan HANYA markdown.';
        this.newMaterial.content = (await this.callAI(prompt)).trim();
        this.newMaterial.title = this.newMaterial.title || this.aiMaterial.topic;
        this.toast('Materi dibuat dengan AI.', 'success');
      } catch (e) { this.toast('AI error: ' + e.message, 'error'); }
      finally { this.aiMaterial.loading = false; }
    },
    resetAllConfig() {
      if (!confirm('Reset semua konfigurasi & logout?')) return;
      try {
        ['ll_sb_url','ll_sb_key','ll_ai_provider','ll_ai_key','ll_ai_model'].forEach(k => localStorage.removeItem(k));
      } catch(e){}
      location.reload();
    },

    toast(msg, type) {
      type = type || 'info';
      const id = Date.now() + Math.random();
      this.toasts.push({ id, msg, type });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 4200);
    },
    renderMD(md) {
      try { return marked.parse(md || ''); }
      catch { return (md || '').replace(/</g,'&lt;'); }
    },
    fmtDate(iso) {
      if (!iso) return '-';
      try { return new Date(iso).toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
      catch(e) { return '-'; }
    }
  };
}
</script>
</head>

<body x-data="app()" x-init="init(); bootWatch();"
      :class="theme === 'dark' ? 'bg-mesh-dark' : 'bg-mesh-light'"
      class="min-h-screen transition-colors duration-500 text-slate-800 dark:text-slate-100"
      x-cloak>

<!-- TOASTS -->
<div class="fixed top-4 right-4 z-[100] space-y-2 w-[340px] max-w-[92vw]">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast-anim rounded-xl px-4 py-3 shadow-xl border glass text-sm font-medium flex items-start gap-2"
         :class="{
           'bg-emerald-50/95 border-emerald-300 text-emerald-800 dark:bg-emerald-950/80 dark:border-emerald-700 dark:text-emerald-200': t.type==='success',
           'bg-rose-50/95 border-rose-300 text-rose-800 dark:bg-rose-950/80 dark:border-rose-700 dark:text-rose-200': t.type==='error',
           'bg-sky-50/95 border-sky-300 text-sky-800 dark:bg-sky-950/80 dark:border-sky-700 dark:text-sky-200': t.type==='info'
         }">
      <i data-lucide="info" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
      <span x-text="t.msg" class="flex-1"></span>
    </div>
  </template>
</div>

<!-- CONFIG MODAL -->
<div x-show="configOpen" x-transition.opacity class="modal-bg" @click.self="configOpen=false" @keydown.escape.window="configOpen=false" x-cloak>
  <div class="w-full max-w-xl max-h-[92vh] overflow-auto rounded-2xl border border-sky-200/40 dark:border-sky-800/40 shadow-2xl glass bg-white/90 dark:bg-slate-900/90">
    <div class="px-6 py-5 bg-gradient-to-r from-sky-900 via-sky-700 to-sky-500 text-white">
      <div class="font-bold text-lg">Pengaturan & AI Provider</div>
    </div>
    <div class="p-6 space-y-4">
      <div>
        <label class="label">AI Provider</label>
        <select x-model="cfgDraft.aiProvider" class="input">
          <option value="gemini">Google Gemini</option>
          <option value="groq">Groq</option>
        </select>
      </div>
      <div>
        <label class="label">Model (opsional)</label>
        <input x-model="cfgDraft.aiModel" class="input" :placeholder="cfgDraft.aiProvider==='gemini' ? 'gemini-1.5-flash' : 'qwen/qwen3.8-27b'">
      </div>
      <div>
        <label class="label">AI API Key</label>
        <input x-model="cfgDraft.aiKey" type="password" class="input font-mono text-xs" placeholder="AIza... (Gemini)">
      </div>
      <div class="flex gap-2 pt-2">
        <button @click="saveConfig()" class="btn btn-primary flex-1"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
        <button @click="configOpen=false" class="btn btn-ghost">Tutup</button>
      </div>
    </div>
  </div>
</div>

<!-- LOADING -->
<template x-if="booting">
  <div class="fixed inset-0 z-40 flex items-center justify-center glass bg-white/60 dark:bg-slate-950/70">
    <div class="flex flex-col items-center gap-3">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-900 via-sky-700 to-sky-500 flex items-center justify-center shadow-2xl glow-blue">
        <i data-lucide="graduation-cap" class="w-7 h-7 text-white"></i>
      </div>

          <div class="flex items-center justify-between flex-wrap gap-3">
            <div>
              <h3 class="font-bold flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-orange-400 animate-pulse"></span> Realtime Live Monitor</h3>
              <p class="text-xs text-slate-500 mt-1">Setiap jawaban yang diklik siswa akan langsung muncul di sini.</p>
            </div>
            <button @click="loadGuruData()" class="btn btn-ghost btn-sm"><i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh</button>
          </div>
        </div>
        <div class="card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 dark:bg-slate-800/60 text-xs uppercase text-slate-600 dark:text-slate-400">
                <tr>
                  <th class="text-left px-4 py-3 font-bold">Siswa</th>
                  <th class="text-left px-4 py-3 font-bold">Kelas / Materi</th>
                  <th class="text-left px-4 py-3 font-bold">Soal</th>
                  <th class="text-center px-4 py-3 font-bold">Jawaban Siswa</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="s in submissions" :key="s.id">
                  <tr class="border-t border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40">
                    <td class="px-4 py-3 font-semibold" x-text="s.profiles?.name || '—'"></td>
                    <td class="px-4 py-3">
                      <div class="text-xs text-slate-500" x-text="s.quizzes?.materials?.classes?.title || '—'"></div>
                    </td>
                    <td class="px-4 py-3 max-w-xs">
                      <div class="truncate" x-text="s.quizzes?.question || '—'"></div>
                      <span class="chip" :class="s.quizzes?.type === 'essay' ? 'bg-orange-100 text-orange-700' : 'bg-sky-100 text-sky-700'" x-text="s.quizzes?.type === 'essay' ? 'Esai' : 'PG'"></span>
                    </td>
                    <td class="px-4 py-3 text-center font-semibold" :class="s.is_correct ? 'text-emerald-600' : 'text-slate-700 dark:text-slate-300'">
                      <span x-text="s.quizzes?.type === 'essay' ? (s.answer_text || s.student_answer || '-') : s.student_answer"></span>
                      <template x-if="s.quizzes?.type === 'pg'">
                        <i :data-lucide="s.is_correct ? 'check' : 'x'" class="w-4 h-4 inline ml-1" :class="s.is_correct ? 'text-emerald-500' : 'text-rose-500'"></i>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- REPORTS -->
      <section x-show="tab==='reports'" class="space-y-5">
        <div class="card p-5">
          <h3 class="font-bold mb-1 flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i> Laporan Per Siswa</h3>
          <p class="text-xs text-slate-500">Pilih kelas untuk mengunduh laporan PDF setiap siswa beserta jawabannya.</p>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <template x-for="c in classes" :key="c.id">
            <div class="card p-4">
              <div class="font-bold mb-1" x-text="c.title"></div>
              <button @click="exportReportPDF(c.id)" class="btn btn-orange btn-sm w-full mt-3"><i data-lucide="download" class="w-3 h-3"></i> Download Laporan (PDF)</button>
            </div>
          </template>
        </div>
      </section>
    </main>

    <!-- SISWA DASHBOARD -->
    <main x-show="profile?.role==='siswa'" x-init="loadSiswaData()" class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
      <div class="flex flex-wrap gap-2 mb-6">
        <button @click="tab='materials'; loadSiswaData()" class="tab-btn" :class="tab==='materials'?'tab-active':'tab-inactive'"><i data-lucide="book-open" class="w-4 h-4"></i> Materi & Tugas</button>
        <button @click="tab='join'; loadSiswaData()" class="tab-btn" :class="tab==='join'?'tab-active':'tab-inactive'"><i data-lucide="user-plus" class="w-4 h-4"></i> Kelas Saya</button>
      </div>

      <section x-show="tab==='materials'" class="space-y-5">
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
          <template x-for="m in materials" :key="m.id">
            <div @click="openMaterial(m)" class="card p-5 transition relative overflow-hidden" :class="m.is_active ? 'hover:shadow-xl hover:-translate-y-0.5 cursor-pointer' : 'opacity-80'">
              <div class="flex items-start justify-between gap-2 mb-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-900 to-sky-500 flex items-center justify-center flex-shrink-0"><i data-lucide="file-text" class="w-5 h-5 text-white"></i></div>
                <span class="chip" :class="m.is_active ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'">
                  <i :data-lucide="m.is_active ? 'unlock' : 'lock'" class="w-3 h-3"></i>
                  <span x-text="m.is_active ? 'Terbuka' : 'Terkunci'"></span>
                </span>
              </div>
              <div class="font-bold mb-1 line-clamp-2" x-text="m.title"></div>
              <div class="text-xs text-slate-500" x-text="m.classes?.title || '—'"></div>
            </div>
          </template>
        </div>
      </section>

      <section x-show="tab==='join'" class="space-y-5">
        <div class="card p-5">
          <h3 class="font-bold mb-3 flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i> Gabung Kelas</h3>
          <div class="flex gap-2">
            <input x-model="joinCode" @keydown.enter="joinClass()" class="input flex-1 font-mono uppercase tracking-widest" placeholder="XXXXXX" maxlength="6">
            <button @click="joinClass()" class="btn btn-primary"><i data-lucide="log-in" class="w-4 h-4"></i> Gabung</button>
          </div>
        </div>
      </section>
    </main>

    <!-- MATERIAL DETAIL MODAL (SISWA) -->
    <div x-show="viewingMaterial" x-transition.opacity class="modal-bg" @click.self="closeMaterial()" @keydown.escape.window="closeMaterial()">
      <div class="w-full max-w-3xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden border border-sky-200/50 dark:border-sky-800/50">
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-gradient-to-r from-sky-50 to-orange-50 dark:from-sky-950/60 dark:to-orange-950/30 flex items-start justify-between gap-3">
          <div class="flex-1 min-w-0">
            <h2 class="font-black text-xl leading-tight mt-0.5" x-text="viewingMaterial?.title"></h2>
          </div>
          <button @click="closeMaterial()" class="text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="flex-1 overflow-auto p-6 space-y-6">
          <article class="prose-render text-sm max-w-none" x-html="renderMD(viewingMaterial?.content || '')"></article>

          <div x-show="quizzes.length > 0" class="border-t border-slate-200 dark:border-slate-800 pt-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-black text-lg flex items-center gap-2"><i data-lucide="help-circle" class="w-5 h-5 text-orange-500"></i> Latihan Soal</h3>
              <div x-show="quizSubmitted" class="chip bg-gradient-to-r from-orange-500 to-orange-400 text-white font-bold text-base px-3 py-1">Skor PG: <span x-text="score"></span></div>
            </div>
            <div class="space-y-5">
              <template x-for="(q,i) in quizzes" :key="q.id">
                <div class="border border-slate-200 dark:border-slate-800 rounded-xl p-4 bg-slate-50 dark:bg-slate-800/40">
                  <div class="font-bold mb-3 flex gap-2 flex-wrap">
                    <span class="chip bg-sky-100 text-sky-800 dark:bg-sky-900/60 dark:text-sky-200 flex-shrink-0" x-text="'#'+(i+1)"></span>
                    <span x-text="q.question"></span>
                  </div>
                  <template x-if="q.question_image">
                    <img :src="q.question_image" class="max-h-64 rounded-lg border border-slate-200 dark:border-slate-700 mb-3" alt="" @error="$el.style.display='none'">
                  </template>
                  
                  <!-- TAMPILAN PG -->
                  <div x-show="q.type !== 'essay'" class="space-y-2">
                    <template x-for="(opt, oi) in q.options" :key="oi">
                      <label class="flex items-center gap-3 p-2.5 rounded-lg cursor-pointer transition border-2"
                             :class="{
                               'border-sky-500 bg-white dark:bg-slate-900': quizAnswers[q.id]===oi && !quizSubmitted,
                               'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-slate-300': quizAnswers[q.id]!==oi && !quizSubmitted,
                               'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40': quizSubmitted && oi===q.correct_option,
                               'border-rose-400 bg-rose-50 dark:bg-rose-950/40': quizSubmitted && quizAnswers[q.id]===oi && oi!==q.correct_option
                             }">
                        <input type="radio" :name="'q_'+q.id" :value="oi" x-model.number="quizAnswers[q.id]" @change="liveSubmitPg(q.id, oi)" :disabled="quizSubmitted" class="sr-only">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition"
                             :class="{
                               'border-sky-500 bg-sky-500': quizAnswers[q.id]===oi && !quizSubmitted,
                               'border-emerald-500 bg-emerald-500': quizSubmitted && oi===q.correct_option,
                               'border-rose-500 bg-rose-500': quizSubmitted && quizAnswers[q.id]===oi && oi!==q.correct_option
                             }"><span class="text-[10px] font-bold text-white" x-text="String.fromCharCode(65+oi)"></span></div>
                        <span class="text-sm font-medium" x-text="opt"></span>
                      </label>
                    </template>
                  </div>

                  <!-- TAMPILAN ESAI -->
                  <div x-show="q.type === 'essay'" class="space-y-2">
                    <textarea x-model="essayAnswers[q.id]" :disabled="quizSubmitted" rows="4" class="input text-sm" placeholder="Ketik jawaban uraian Anda di sini..."></textarea>
                    <button x-show="!quizSubmitted" @click="saveEssay(q.id)" class="btn btn-ghost btn-sm text-sky-600 border border-sky-200">Simpan Jawaban Esai</button>
                  </div>

                  <div x-show="quizSubmitted" class="mt-3 text-xs bg-white dark:bg-slate-900 rounded-lg p-3 border-l-4 border-sky-500">
                    <div class="font-bold mb-1">💡 Kunci / Penjelasan:</div>
                    <div class="text-slate-600 dark:text-slate-400" x-text="q.explanation"></div>
                  </div>
                </div>
              </template>
            </div>
            <div class="mt-5 flex gap-2 justify-end">
              <button x-show="!quizSubmitted" @click="submitQuiz()" :disabled="submitting" class="btn btn-primary">Selesai & Kirim Jawaban</button>
              <button x-show="quizSubmitted" @click="printStudentResult()" class="btn btn-ghost text-sky-600 border border-sky-200 dark:border-sky-800"><i data-lucide="printer" class="w-4 h-4"></i> Cetak Hasil</button>
              <button x-show="quizSubmitted" @click="closeMaterial()" class="btn btn-orange"><i data-lucide="check" class="w-4 h-4"></i> Tutup</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- EXCEL IMPORT MODAL -->
    <div x-show="excelImportOpen" x-transition.opacity class="modal-bg" @click.self="closeExcelImport()" @keydown.escape.window="closeExcelImport()" x-cloak>
      <div class="w-full max-w-4xl max-h-[92vh] flex flex-col bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-orange-200/50 dark:border-orange-800/50">
        <div class="px-6 py-4 bg-gradient-to-r from-orange-500 to-orange-400 text-white flex items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="font-bold text-lg">Import Soal dari Excel</div>
            <div class="text-xs text-orange-100 truncate" x-text="excelFileName || 'Preview'"></div>
          </div>
          <button @click="closeExcelImport()" class="text-white/90 hover:bg-white/20 p-2 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="flex-1 overflow-auto p-5">
          <div class="space-y-3">
            <template x-for="(row, i) in excelPreview" :key="i">
              <div class="rounded-xl border p-4" :class="row._valid ? 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40' : 'border-rose-300 bg-rose-50 opacity-70'">
                <div class="text-sm font-bold mb-2" x-text="row.question"></div>
                <div class="space-y-1">
                  <template x-for="(opt, oi) in row.options" :key="oi">
                    <div class="text-xs flex items-center gap-2" :class="oi === row.correct_option ? 'font-bold text-emerald-700' : 'text-slate-600'">
                      <span class="w-5 h-5 rounded-full flex items-center justify-center bg-slate-200 text-[10px]" x-text="String.fromCharCode(65+oi)"></span>
                      <span x-text="opt"></span>
                    </div>
                  </template>
                </div>
                <template x-if="!row._valid">
                  <div class="text-xs text-rose-600 mt-1 font-bold" x-text="'⚠ ' + row._error"></div>
                </template>
              </div>
            </template>
          </div>
        </div>
        <div class="px-5 py-4 border-t flex gap-2 justify-end bg-slate-50">
          <button @click="closeExcelImport()" class="btn btn-ghost">Batal</button>
          <button @click="confirmExcelImport()" class="btn btn-primary" :disabled="!excelPreview.filter(r => r._valid).length">
            Import <span x-text="excelPreview.filter(r => r._valid).length"></span> Soal
          </button>
        </div>
      </div>
    </div>

    <footer class="border-t border-slate-200/60 dark:border-slate-800/60 py-4 text-center text-xs text-slate-500">
      Adjarindo Creative Aksara © <span x-text="new Date().getFullYear()"></span> · <span x-text="mode==='demo' ? 'Demo Mode' : 'Cloud Mode'"></span> · <span class="gradient-text font-bold">Modern Learning Platform</span>
    </footer>
  </div>
</template>

<script>
  if (typeof window !== 'undefined') {
    window.addEventListener('load', () => {
      try { if (window.lucide) lucide.createIcons(); } catch(e){}
    });
  }
</script>
</body>
</html>
